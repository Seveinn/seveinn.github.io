<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>批量抠图 · 动画预览 · Sprite Sheet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <style>
    :root {
      --bg: #141210;
      --panel: #1e1b18;
      --panel-2: #26221e;
      --line: #3a342e;
      --text: #f0ebe3;
      --muted: #9a9084;
      --accent: #e8a04a;
      --accent-dim: #c47d2a;
      --ok: #6dbf8a;
      --checker-a: #2a2622;
      --checker-b: #1a1714;
      --radius: 10px;
      --font: "Outfit", system-ui, sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, monospace;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: var(--font);
      color: var(--text);
      background:
        radial-gradient(1200px 600px at 10% -10%, #2a2218 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 0%, #1a2420 0%, transparent 50%),
        var(--bg);
      display: grid;
      grid-template-columns: 320px 1fr;
      min-height: 100vh;
    }

    aside {
      border-right: 1px solid var(--line);
      background: color-mix(in srgb, var(--panel) 92%, transparent);
      backdrop-filter: blur(8px);
      padding: 18px 16px 24px;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .brand h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .brand p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.4;
    }

    .drop {
      border: 1.5px dashed var(--line);
      border-radius: var(--radius);
      padding: 14px 12px;
      text-align: center;
      background: var(--panel-2);
      cursor: pointer;
      transition: border-color .15s, background .15s;
    }
    .drop:hover, .drop.dragover {
      border-color: var(--accent);
      background: #2c261f;
    }
    .drop strong { display: block; margin-bottom: 4px; font-size: 0.9rem; }
    .drop span { color: var(--muted); font-size: 0.75rem; }
    .drop input { display: none; }

    .section-title {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin: 0 0 8px;
      font-weight: 600;
    }

    .params { display: flex; flex-direction: column; gap: 8px; }
    .param {
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 10px;
    }
    .param-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 6px;
      gap: 8px;
    }
    .param-head label { font-size: 0.85rem; font-weight: 500; }
    .param-head output {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--accent);
    }
    .param input[type="range"], .field input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }
    .param .hint {
      margin: 4px 0 0;
      font-size: 0.68rem;
      color: var(--muted);
      line-height: 1.3;
    }

    .bg-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .swatch {
      width: 32px; height: 32px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #e6e6e5;
      flex-shrink: 0;
    }

    button, select {
      font-family: var(--font);
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.82rem;
      cursor: pointer;
      transition: background .15s, border-color .15s;
    }
    button:hover:not(:disabled), .toolbar button:hover { border-color: var(--accent); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    select {
      width: 100%;
      background: var(--panel-2);
      outline: none;
    }
    select:focus { border-color: var(--accent); }

    .btn-row { display: flex; gap: 6px; }
    .btn-row button { flex: 1; padding: 8px 6px; font-size: 0.78rem; }

    .field { margin-bottom: 10px; }
    .field label {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .field label output, .field label .val {
      font-family: var(--mono);
      color: var(--text);
      font-size: 0.78rem;
    }

    .actions { display: flex; flex-direction: column; gap: 8px; }
    .actions button.primary {
      background: linear-gradient(180deg, var(--accent), var(--accent-dim));
      border-color: transparent;
      color: #1a1208;
      font-weight: 600;
    }
    .actions button.accent {
      background: #2e3a32;
      border-color: #3d5246;
      color: var(--ok);
      font-weight: 600;
    }
    .actions button.ghost { background: transparent; }

    main {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      height: 100vh;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--panel) 80%, transparent);
      flex-shrink: 0;
    }
    .toolbar .status {
      margin-left: auto;
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted);
    }
    .preview-bg {
      display: flex;
      gap: 6px;
      align-items: center;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .preview-bg button {
      width: 26px; height: 26px; padding: 0; border-radius: 6px;
    }
    .preview-bg .chk {
      background:
        linear-gradient(45deg, var(--checker-a) 25%, transparent 25%) -6px 0 / 12px 12px,
        linear-gradient(-45deg, var(--checker-a) 25%, transparent 25%) -6px 0 / 12px 12px,
        linear-gradient(45deg, transparent 75%, var(--checker-a) 75%) -6px 0 / 12px 12px,
        linear-gradient(-45deg, transparent 75%, var(--checker-a) 75%) -6px 0 / 12px 12px,
        var(--checker-b);
    }
    .preview-bg .dark { background: #0a0a0a; }
    .preview-bg .light { background: #e8e4dc; }

    .progress { height: 3px; background: var(--line); overflow: hidden; flex-shrink: 0; }
    .progress > i {
      display: block; height: 100%; width: 0%;
      background: var(--accent); transition: width .12s;
    }

    .workspace {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 12px 16px 16px;
    }

    .stage-wrap {
      flex: 1;
      min-height: 220px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      position: relative;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: var(--checker-b);
    }
    .stage-wrap.checker {
      background-image:
        linear-gradient(45deg, var(--checker-a) 25%, transparent 25%),
        linear-gradient(-45deg, var(--checker-a) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, var(--checker-a) 75%),
        linear-gradient(-45deg, transparent 75%, var(--checker-a) 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0;
    }
    .stage-wrap.dark { background: #0a0a0a; background-image: none; }
    .stage-wrap.light { background: #e8e4dc; background-image: none; }

    #stage {
      max-width: 92%;
      max-height: 92%;
      image-rendering: auto;
    }
    .hud {
      position: absolute;
      top: 10px; left: 10px;
      background: rgba(20, 18, 16, 0.78);
      backdrop-filter: blur(4px);
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 0.72rem;
      color: var(--muted);
      border: 1px solid var(--line);
      font-family: var(--mono);
    }
    .stage-empty {
      position: absolute;
      color: var(--muted);
      font-size: 0.9rem;
      pointer-events: none;
    }

    .timeline {
      flex-shrink: 0;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 10px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      min-height: 96px;
      align-items: center;
    }
    .timeline .hint-empty {
      color: var(--muted);
      font-size: 0.85rem;
      margin: auto;
    }
    .frame-thumb {
      width: 72px; height: 72px;
      border: 2px solid var(--line);
      border-radius: 6px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      position: relative;
      cursor: pointer;
      overflow: hidden;
      background: #0e0c0a;
    }
    .frame-thumb.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
    }
    .frame-thumb canvas, .frame-thumb img {
      max-width: 100%; max-height: 100%;
      object-fit: contain;
    }
    .frame-thumb .num {
      position: absolute;
      bottom: 2px; right: 2px;
      background: rgba(0,0,0,0.7);
      color: #fff;
      font-size: 0.65rem;
      padding: 1px 4px;
      border-radius: 3px;
      font-family: var(--mono);
    }
    .frame-thumb .dot {
      position: absolute;
      top: 3px; left: 3px;
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--ok);
      display: none;
    }
    .frame-thumb.done .dot { display: block; }

    /* modals */
    .modal {
      position: fixed; inset: 0;
      background: rgba(8, 6, 4, 0.82);
      z-index: 40;
      display: none;
      place-items: center;
      padding: 24px;
    }
    .modal.open { display: grid; }
    .modal-panel {
      width: min(1100px, 100%);
      max-height: 92vh;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .modal-head {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
    }
    .modal-head h2 { margin: 0; font-size: 1rem; flex: 1; }
    .modal-body { min-height: 0; flex: 1; overflow: auto; }

    .compare-body {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: var(--line);
      min-height: 0;
    }
    .compare-pane {
      background: var(--bg);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .compare-pane .label {
      padding: 8px 12px;
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .compare-pane .stage {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 16px;
      overflow: auto;
      min-height: 260px;
    }
    .compare-pane .stage.checker {
      background:
        linear-gradient(45deg, var(--checker-a) 25%, transparent 25%) 0 0 / 20px 20px,
        linear-gradient(-45deg, var(--checker-a) 25%, transparent 25%) 0 0 / 20px 20px,
        linear-gradient(45deg, transparent 75%, var(--checker-a) 75%) 0 0 / 20px 20px,
        linear-gradient(-45deg, transparent 75%, var(--checker-a) 75%) 0 0 / 20px 20px,
        var(--checker-b);
    }
    .compare-pane .stage.dark { background: #0a0a0a; }
    .compare-pane .stage.light { background: #e8e4dc; }
    .compare-pane canvas { max-width: 100%; max-height: 55vh; }

    .sheet-body { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
    .sheet-preview {
      max-height: 55vh;
      overflow: auto;
      background: #0e0c0a;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      text-align: center;
    }
    .sheet-preview canvas {
      max-width: 100%;
      height: auto;
      image-rendering: auto;
    }
    .sheet-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      flex-wrap: wrap;
    }
    .sheet-actions button.primary {
      background: linear-gradient(180deg, var(--accent), var(--accent-dim));
      border-color: transparent;
      color: #1a1208;
      font-weight: 600;
    }

    details.block {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-2);
      padding: 0;
    }
    details.block > summary {
      cursor: pointer;
      padding: 10px 12px;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      font-weight: 600;
      list-style: none;
    }
    details.block > summary::-webkit-details-marker { display: none; }
    details.block[open] > summary { border-bottom: 1px solid var(--line); }
    details.block .inner { padding: 10px 12px 12px; }

    @media (max-width: 900px) {
      body { grid-template-columns: 1fr; }
      aside { border-right: none; border-bottom: 1px solid var(--line); max-height: 48vh; }
      main { height: auto; min-height: 60vh; }
      .compare-body { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <aside>
    <div class="brand">
      <h1>抠图 · 动画 · Sheet</h1>
      <p>批量抠图后可预览帧动画，并合成导出 Sprite Sheet</p>
    </div>

    <label class="drop" id="dropzone">
      <strong>拖入或点击导入序列帧</strong>
      <span>PNG / JPG / WEBP · 按文件名自然排序</span>
      <input type="file" id="fileInput" accept="image/*" multiple />
    </label>

    <div>
      <p class="section-title">背景色</p>
      <div class="bg-row">
        <div class="swatch" id="bgSwatch" title="当前采样/指定背景色"></div>
        <button type="button" id="btnAutoBg">自动采样</button>
        <label style="font-size:0.78rem;color:var(--muted);display:flex;align-items:center;gap:6px;cursor:pointer">
          <input type="color" id="bgColor" value="#e6e6e5" style="width:32px;height:26px;border:none;background:transparent;padding:0;cursor:pointer" />
          手动
        </label>
      </div>
    </div>

    <details class="block" open>
      <summary>抠图参数</summary>
      <div class="inner params">
        <div class="param">
          <div class="param-head"><label for="tol">容差 TOL</label><output id="tolOut">42</output></div>
          <input type="range" id="tol" min="0" max="120" step="1" value="42" />
          <p class="hint">与背景色 RGB 距离阈值</p>
        </div>
        <div class="param">
          <div class="param-head"><label for="inset">向内抠 INSET</label><output id="insetOut">5</output></div>
          <input type="range" id="inset" min="0" max="20" step="1" value="5" />
          <p class="hint">腐蚀轮廓，去掉白边</p>
        </div>
        <div class="param">
          <div class="param-head"><label for="fringe">去白边 FRINGE</label><output id="fringeOut">55</output></div>
          <input type="range" id="fringe" min="0" max="120" step="1" value="55" />
        </div>
        <div class="param">
          <div class="param-head"><label for="soft">软边 SOFT</label><output id="softOut">0</output></div>
          <input type="range" id="soft" min="0" max="40" step="1" value="0" />
        </div>
      </div>
    </details>

    <details class="block" open>
      <summary>动画播放</summary>
      <div class="inner">
        <div class="btn-row" style="margin-bottom:10px">
          <button type="button" id="playBtn">暂停</button>
          <button type="button" id="prevBtn">上一帧</button>
          <button type="button" id="nextBtn">下一帧</button>
        </div>
        <div class="field">
          <label>播放模式</label>
          <select id="playMode">
            <option value="loop">循环 Loop</option>
            <option value="pingpong">乒乓 Ping-Pong</option>
            <option value="once">单次 Once</option>
          </select>
        </div>
        <div class="field">
          <label>镜像 Flip X</label>
          <select id="flipX">
            <option value="false">正常</option>
            <option value="true">水平翻转</option>
          </select>
        </div>
        <div class="field">
          <label>目标帧率 FPS <output id="fpsVal">12</output></label>
          <input type="range" id="fpsRange" min="1" max="60" value="12" />
        </div>
        <div class="field">
          <label>播放速率 <output id="speedVal">1.0x</output></label>
          <input type="range" id="speedRange" min="0.1" max="3" step="0.1" value="1" />
        </div>
        <div class="field" style="margin-bottom:0">
          <label>每帧额外延迟 <output id="delayVal">0 ms</output></label>
          <input type="range" id="delayRange" min="0" max="500" step="10" value="0" />
        </div>
      </div>
    </details>

    <div class="actions">
      <button type="button" class="primary" id="btnProcess" disabled>处理全部抠图</button>
      <button type="button" class="accent" id="exportBtn" disabled>合成 Sprite Sheet</button>
      <button type="button" id="btnDownload" disabled>下载透明帧 ZIP</button>
      <button type="button" class="ghost" id="btnClear" disabled>清空列表</button>
    </div>
  </aside>

  <main>
    <div class="toolbar">
      <div class="preview-bg">
        预览底：
        <button type="button" class="chk" data-bg="checker" title="棋盘格"></button>
        <button type="button" class="dark" data-bg="dark" title="黑底"></button>
        <button type="button" class="light" data-bg="light" title="浅底"></button>
      </div>
      <button type="button" id="btnReprocessSel" disabled>重算当前帧</button>
      <button type="button" id="btnCompare" disabled>对比抠图</button>
      <div class="status" id="status">未导入图片</div>
    </div>
    <div class="progress"><i id="progressBar"></i></div>

    <div class="workspace">
      <div class="stage-wrap checker" id="stageWrap">
        <div class="hud" id="hudInfo">FPS: 12 · 帧: 0/0</div>
        <canvas id="stage"></canvas>
        <div class="stage-empty" id="stageEmpty">导入序列帧后在此预览动画</div>
      </div>
      <div class="timeline" id="timeline">
        <div class="hint-empty">时间轴：导入图片后显示各帧缩略图</div>
      </div>
    </div>
  </main>

  <!-- 抠图对比 -->
  <div class="modal" id="compare">
    <div class="modal-panel">
      <div class="modal-head">
        <h2 id="compareTitle">对比预览</h2>
        <button type="button" id="btnCloseCompare">关闭</button>
      </div>
      <div class="modal-body compare-body">
        <div class="compare-pane">
          <div class="label">原图</div>
          <div class="stage checker" id="stageBefore"></div>
        </div>
        <div class="compare-pane">
          <div class="label">抠图后</div>
          <div class="stage checker" id="stageAfter"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Sprite Sheet -->
  <div class="modal" id="exportModal">
    <div class="modal-panel" style="width:min(960px,100%)">
      <div class="modal-head">
        <h2>合成 Sprite Sheet</h2>
        <button type="button" id="closeModalBtn">关闭</button>
      </div>
      <div class="modal-body sheet-body">
        <div class="field" style="margin:0;max-width:360px">
          <label>排列方向</label>
          <select id="sheetLayout">
            <option value="horizontal">横向一字排开（1 行 N 列）</option>
            <option value="grid">网格自动排布（Grid Auto）</option>
          </select>
        </div>
        <p style="margin:0;font-size:0.8rem;color:var(--muted)">优先使用已抠图透明帧；未处理的帧用原图。可勾选「仅已抠图」避免混入实底。</p>
        <label style="display:flex;align-items:center;gap:8px;font-size:0.85rem;color:var(--muted);cursor:pointer">
          <input type="checkbox" id="sheetOnlyProcessed" checked />
          仅导出已抠图的帧
        </label>
        <div class="sheet-preview">
          <canvas id="spriteCanvas"></canvas>
        </div>
        <div class="sheet-actions">
          <button type="button" id="closeModalBtn2">取消</button>
          <button type="button" class="primary" id="downloadSheetBtn">下载 PNG 精灵图</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const state = {
      items: [],
      selectedId: null,
      previewBg: "checker",
      useManualBg: false,
      manualBg: [230, 230, 229],
      autoSample: true,
      // animation
      currentFrame: 0,
      isPlaying: true,
      fps: 12,
      speed: 1,
      extraDelay: 0,
      playMode: "loop",
      direction: 1,
      flipX: false,
      lastFrameTime: 0,
    };

    const $ = (sel) => document.querySelector(sel);
    const timeline = $("#timeline");
    const statusEl = $("#status");
    const progressBar = $("#progressBar");
    const stage = $("#stage");
    const stageCtx = stage.getContext("2d");
    const stageWrap = $("#stageWrap");
    const stageEmpty = $("#stageEmpty");
    const hudInfo = $("#hudInfo");
    const spriteCanvas = $("#spriteCanvas");
    const spriteCtx = spriteCanvas.getContext("2d");

    function params() {
      return {
        tol: +$("#tol").value,
        inset: +$("#inset").value,
        fringe: +$("#fringe").value,
        soft: +$("#soft").value,
      };
    }

    function bindParam(id, outId) {
      const el = $("#" + id);
      const out = $("#" + outId);
      const sync = () => { out.textContent = el.value; };
      el.addEventListener("input", () => {
        sync();
        schedulePreviewSelected();
      });
      sync();
    }
    bindParam("tol", "tolOut");
    bindParam("inset", "insetOut");
    bindParam("fringe", "fringeOut");
    bindParam("soft", "softOut");

    let previewTimer = null;
    function schedulePreviewSelected() {
      clearTimeout(previewTimer);
      previewTimer = setTimeout(async () => {
        const item = state.items[state.currentFrame];
        if (!item) return;
        await processItem(item);
        renderTimeline();
        renderFrame();
      }, 180);
    }

    function frameSource(item) {
      return item.processed && item.resultCanvas ? item.resultCanvas : item.sourceCanvas;
    }

    function setStatus(t) { statusEl.textContent = t; }

    function updateButtons() {
      const n = state.items.length;
      const done = state.items.filter((i) => i.processed).length;
      $("#btnProcess").disabled = n === 0;
      $("#btnDownload").disabled = done === 0;
      $("#exportBtn").disabled = n === 0;
      $("#btnClear").disabled = n === 0;
      $("#btnReprocessSel").disabled = n === 0;
      $("#btnCompare").disabled = n === 0;
    }

    function sampleBgFromImageData(data, w, h) {
      const at = (x, y) => {
        const i = (y * w + x) * 4;
        return [data[i], data[i + 1], data[i + 2]];
      };
      const samples = [
        at(0, 0), at(w - 1, 0), at(0, h - 1),
        at(Math.min(10, w - 1), Math.min(10, h - 1)),
        at(Math.floor(w / 2), 0), at(0, Math.floor(h / 2)),
      ];
      const bg = [0, 0, 0];
      for (const s of samples) { bg[0] += s[0]; bg[1] += s[1]; bg[2] += s[2]; }
      return [bg[0] / samples.length, bg[1] / samples.length, bg[2] / samples.length];
    }

    function setBgSwatch(rgb) {
      const [r, g, b] = rgb.map((v) => Math.round(v));
      $("#bgSwatch").style.background = `rgb(${r},${g},${b})`;
      if (!state.useManualBg) {
        $("#bgColor").value = "#" + [r, g, b].map((v) => v.toString(16).padStart(2, "0")).join("");
      }
    }

    function hexToRgb(hex) {
      const n = parseInt(hex.slice(1), 16);
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }

    function binaryDilate(mask, w, h, iterations) {
      let cur = mask;
      for (let it = 0; it < iterations; it++) {
        const next = new Uint8Array(cur);
        for (let y = 0; y < h; y++) {
          for (let x = 0; x < w; x++) {
            const i = y * w + x;
            if (cur[i]) continue;
            if (
              (x > 0 && cur[i - 1]) || (x + 1 < w && cur[i + 1]) ||
              (y > 0 && cur[i - w]) || (y + 1 < h && cur[i + w])
            ) next[i] = 1;
          }
        }
        cur = next;
      }
      return cur;
    }

    function removeBackground(sourceCanvas, opts, bgOverride) {
      const w = sourceCanvas.width;
      const h = sourceCanvas.height;
      const ctx = sourceCanvas.getContext("2d", { willReadFrequently: true });
      const src = ctx.getImageData(0, 0, w, h).data;
      const bg = bgOverride || sampleBgFromImageData(src, w, h);
      const { tol, inset, fringe, soft } = opts;

      const dist = new Float32Array(w * h);
      const eligible = new Uint8Array(w * h);
      for (let i = 0, p = 0; i < src.length; i += 4, p++) {
        const dr = src[i] - bg[0], dg = src[i + 1] - bg[1], db = src[i + 2] - bg[2];
        const d = Math.sqrt(dr * dr + dg * dg + db * db);
        dist[p] = d;
        eligible[p] = d <= tol ? 1 : 0;
      }

      let mask = new Uint8Array(w * h);
      const q = new Int32Array(w * h);
      let qh = 0, qt = 0;
      const tryPush = (x, y) => {
        if (x < 0 || y < 0 || x >= w || y >= h) return;
        const i = y * w + x;
        if (!eligible[i] || mask[i]) return;
        mask[i] = 1;
        q[qt++] = i;
      };
      for (let x = 0; x < w; x++) { tryPush(x, 0); tryPush(x, h - 1); }
      for (let y = 0; y < h; y++) { tryPush(0, y); tryPush(w - 1, y); }
      while (qh < qt) {
        const i = q[qh++];
        const x = i % w, y = (i / w) | 0;
        tryPush(x - 1, y); tryPush(x + 1, y); tryPush(x, y - 1); tryPush(x, y + 1);
      }

      if (inset > 0) mask = binaryDilate(mask, w, h, inset);

      const out = new ImageData(w, h);
      const dst = out.data;
      dst.set(src);
      for (let p = 0; p < mask.length; p++) if (mask[p]) dst[p * 4 + 3] = 0;

      if (fringe > 0) {
        const edge = binaryDilate(mask, w, h, 2);
        for (let p = 0; p < mask.length; p++) {
          if (edge[p] && !mask[p] && dist[p] <= fringe) {
            dst[p * 4 + 3] = 0;
            mask[p] = 1;
          }
        }
      }

      if (soft > 0) {
        const softZone = binaryDilate(mask, w, h, 1);
        for (let p = 0; p < mask.length; p++) {
          if (!softZone[p] || mask[p] || dist[p] >= tol + soft) continue;
          const t = Math.max(0, Math.min(1, (dist[p] - tol) / soft));
          dst[p * 4 + 3] = Math.min(dst[p * 4 + 3], (255 * t) | 0);
        }
      }

      const canvas = document.createElement("canvas");
      canvas.width = w;
      canvas.height = h;
      canvas.getContext("2d").putImageData(out, 0, 0);
      return { canvas, bg };
    }

    async function loadFile(file) {
      const bitmap = await createImageBitmap(file);
      const canvas = document.createElement("canvas");
      canvas.width = bitmap.width;
      canvas.height = bitmap.height;
      canvas.getContext("2d").drawImage(bitmap, 0, 0);
      bitmap.close?.();
      return {
        id: crypto.randomUUID(),
        name: file.name.replace(/\.[^.]+$/, "") + ".png",
        width: canvas.width,
        height: canvas.height,
        sourceCanvas: canvas,
        resultCanvas: null,
        processed: false,
        bg: null,
      };
    }

    async function addFiles(fileList) {
      const files = [...fileList]
        .filter((f) => f.type.startsWith("image/"))
        .sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: "base" }));
      if (!files.length) return;

      setStatus(`导入中… 0/${files.length}`);
      for (let i = 0; i < files.length; i++) {
        state.items.push(await loadFile(files[i]));
        setStatus(`导入中… ${i + 1}/${files.length}`);
        progressBar.style.width = ((i + 1) / files.length * 100) + "%";
      }

      if (state.autoSample && state.items.length) {
        const first = state.items[0];
        const ctx = first.sourceCanvas.getContext("2d", { willReadFrequently: true });
        const data = ctx.getImageData(0, 0, first.width, first.height).data;
        setBgSwatch(sampleBgFromImageData(data, first.width, first.height));
      }

      state.currentFrame = 0;
      state.direction = 1;
      state.selectedId = state.items[0]?.id || null;
      updateCanvasSize();
      renderTimeline();
      renderFrame();
      updateButtons();
      stageEmpty.style.display = state.items.length ? "none" : "";
      setStatus(`已导入 ${state.items.length} 张 · 可播放预览或处理抠图`);
      progressBar.style.width = "0%";
    }

    function resolveBg(item) {
      if (state.useManualBg) return state.manualBg.slice();
      const ctx = item.sourceCanvas.getContext("2d", { willReadFrequently: true });
      const data = ctx.getImageData(0, 0, item.width, item.height).data;
      return sampleBgFromImageData(data, item.width, item.height);
    }

    async function processItem(item) {
      const { canvas, bg: used } = removeBackground(item.sourceCanvas, params(), resolveBg(item));
      item.resultCanvas = canvas;
      item.processed = true;
      item.bg = used;
      setBgSwatch(used);
      return item;
    }

    async function processAll() {
      if (!state.items.length) return;
      $("#btnProcess").disabled = true;
      const n = state.items.length;
      for (let i = 0; i < n; i++) {
        setStatus(`抠图 ${i + 1}/${n} · ${state.items[i].name}`);
        progressBar.style.width = ((i + 1) / n * 100) + "%";
        await processItem(state.items[i]);
        await new Promise((r) => setTimeout(r, 0));
        renderTimeline();
        if (i === state.currentFrame) renderFrame();
      }
      setStatus(`抠图完成 ${n} 张 · TOL=${params().tol} INSET=${params().inset}`);
      progressBar.style.width = "0%";
      updateButtons();
      renderFrame();
    }

    function updateCanvasSize() {
      if (!state.items.length) return;
      const src = frameSource(state.items[0]);
      stage.width = src.width;
      stage.height = src.height;
    }

    function renderFrame() {
      if (!state.items.length) {
        stageCtx.clearRect(0, 0, stage.width, stage.height);
        hudInfo.textContent = `FPS: ${state.fps} · 帧: 0/0`;
        return;
      }
      const item = state.items[state.currentFrame];
      const src = frameSource(item);
      if (stage.width !== src.width || stage.height !== src.height) {
        stage.width = src.width;
        stage.height = src.height;
      }
      stageCtx.clearRect(0, 0, stage.width, stage.height);
      stageCtx.save();
      if (state.flipX) {
        stageCtx.translate(stage.width, 0);
        stageCtx.scale(-1, 1);
      }
      stageCtx.drawImage(src, 0, 0);
      stageCtx.restore();

      const tag = item.processed ? "抠图" : "原图";
      hudInfo.textContent =
        `FPS: ${state.fps} · 速率: ${state.speed}x · 帧: ${state.currentFrame + 1}/${state.items.length} · ${tag}`;
      updateTimelineUI();
    }

    function renderTimeline() {
      if (!state.items.length) {
        timeline.innerHTML = `<div class="hint-empty">时间轴：导入图片后显示各帧缩略图</div>`;
        return;
      }
      timeline.innerHTML = "";
      state.items.forEach((item, idx) => {
        const thumb = document.createElement("div");
        thumb.className = "frame-thumb"
          + (idx === state.currentFrame ? " active" : "")
          + (item.processed ? " done" : "");
        thumb.dataset.index = idx;

        const src = frameSource(item);
        const c = document.createElement("canvas");
        const max = 68;
        const scale = Math.min(1, max / Math.max(item.width, item.height));
        c.width = Math.max(1, Math.round(item.width * scale));
        c.height = Math.max(1, Math.round(item.height * scale));
        c.getContext("2d").drawImage(src, 0, 0, c.width, c.height);

        const num = document.createElement("div");
        num.className = "num";
        num.textContent = idx;

        const dot = document.createElement("div");
        dot.className = "dot";
        dot.title = "已抠图";

        thumb.appendChild(c);
        thumb.appendChild(num);
        thumb.appendChild(dot);
        thumb.addEventListener("click", () => {
          state.currentFrame = idx;
          state.selectedId = item.id;
          state.isPlaying = false;
          $("#playBtn").textContent = "播放";
          renderFrame();
        });
        thumb.addEventListener("dblclick", () => openCompare(idx));
        timeline.appendChild(thumb);
      });
    }

    function updateTimelineUI() {
      const thumbs = timeline.querySelectorAll(".frame-thumb");
      thumbs.forEach((t, i) => {
        t.classList.toggle("active", i === state.currentFrame);
        if (i === state.currentFrame) {
          t.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "center" });
        }
      });
    }

    function advanceFrame() {
      const total = state.items.length;
      if (!total) return;
      if (state.playMode === "loop") {
        state.currentFrame = (state.currentFrame + 1) % total;
      } else if (state.playMode === "once") {
        if (state.currentFrame < total - 1) state.currentFrame++;
        else {
          state.isPlaying = false;
          $("#playBtn").textContent = "播放";
        }
      } else if (state.playMode === "pingpong") {
        if (state.direction === 1) {
          if (state.currentFrame < total - 1) state.currentFrame++;
          else { state.direction = -1; state.currentFrame--; }
        } else {
          if (state.currentFrame > 0) state.currentFrame--;
          else { state.direction = 1; state.currentFrame++; }
        }
      }
      state.selectedId = state.items[state.currentFrame]?.id;
    }

    function animLoop(timestamp) {
      if (!state.lastFrameTime) state.lastFrameTime = timestamp;
      if (state.isPlaying && state.items.length > 0) {
        const interval = 1000 / (state.fps * state.speed) + state.extraDelay;
        if (timestamp - state.lastFrameTime >= interval) {
          advanceFrame();
          renderFrame();
          state.lastFrameTime = timestamp;
        }
      }
      requestAnimationFrame(animLoop);
    }

    function applyPreviewBgClass() {
      stageWrap.classList.remove("checker", "dark", "light");
      stageWrap.classList.add(state.previewBg);
      document.querySelectorAll(".compare-pane .stage").forEach((el) => {
        el.classList.remove("checker", "dark", "light");
        el.classList.add(state.previewBg);
      });
    }

    async function openCompare(index) {
      if (index == null) index = state.currentFrame;
      const item = state.items[index];
      if (!item) return;
      state.currentFrame = index;
      state.selectedId = item.id;
      renderFrame();

      const before = $("#stageBefore");
      const after = $("#stageAfter");
      before.className = "stage " + state.previewBg;
      after.className = "stage " + state.previewBg;
      before.innerHTML = "";
      after.innerHTML = "";
      before.appendChild(cloneCanvas(item.sourceCanvas));
      if (!item.processed) await processItem(item);
      after.appendChild(cloneCanvas(item.resultCanvas));
      renderTimeline();
      updateButtons();
      $("#compareTitle").textContent = item.name;
      $("#compare").classList.add("open");
    }

    function cloneCanvas(src) {
      const c = document.createElement("canvas");
      c.width = src.width;
      c.height = src.height;
      c.getContext("2d").drawImage(src, 0, 0);
      return c;
    }

    function sheetFrames() {
      const only = $("#sheetOnlyProcessed").checked;
      return state.items.filter((i) => !only || i.processed);
    }

    function buildSpriteSheet() {
      const frames = sheetFrames();
      if (!frames.length) {
        spriteCanvas.width = 1;
        spriteCanvas.height = 1;
        spriteCtx.clearRect(0, 0, 1, 1);
        return;
      }
      const frameW = frames[0].width;
      const frameH = frames[0].height;
      const count = frames.length;
      let cols = count, rows = 1;
      if ($("#sheetLayout").value === "grid") {
        cols = Math.ceil(Math.sqrt(count));
        rows = Math.ceil(count / cols);
      }
      spriteCanvas.width = cols * frameW;
      spriteCanvas.height = rows * frameH;
      spriteCtx.clearRect(0, 0, spriteCanvas.width, spriteCanvas.height);
      frames.forEach((item, idx) => {
        const c = idx % cols;
        const r = Math.floor(idx / cols);
        spriteCtx.drawImage(frameSource(item), c * frameW, r * frameH);
      });
    }

    async function downloadZip() {
      const ready = state.items.filter((i) => i.processed && i.resultCanvas);
      if (!ready.length) return;
      setStatus("打包 ZIP…");
      const zip = new JSZip();
      for (const item of ready) {
        const blob = await new Promise((res) => item.resultCanvas.toBlob(res, "image/png"));
        zip.file(item.name, blob);
      }
      const out = await zip.generateAsync({ type: "blob" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(out);
      a.download = "sprites-transparent.zip";
      a.click();
      URL.revokeObjectURL(a.href);
      setStatus(`已下载 ${ready.length} 张 ZIP`);
    }

    // —— events ——
    const dropzone = $("#dropzone");
    const fileInput = $("#fileInput");
    dropzone.addEventListener("dragover", (e) => { e.preventDefault(); dropzone.classList.add("dragover"); });
    dropzone.addEventListener("dragleave", () => dropzone.classList.remove("dragover"));
    dropzone.addEventListener("drop", (e) => {
      e.preventDefault();
      dropzone.classList.remove("dragover");
      addFiles(e.dataTransfer.files);
    });
    fileInput.addEventListener("change", () => {
      addFiles(fileInput.files);
      fileInput.value = "";
    });

    $("#btnAutoBg").addEventListener("click", () => {
      state.useManualBg = false;
      state.autoSample = true;
      const item = state.items[state.currentFrame] || state.items[0];
      if (!item) return;
      const ctx = item.sourceCanvas.getContext("2d", { willReadFrequently: true });
      const data = ctx.getImageData(0, 0, item.width, item.height).data;
      setBgSwatch(sampleBgFromImageData(data, item.width, item.height));
      schedulePreviewSelected();
      setStatus("已切换为自动采样背景色");
    });

    $("#bgColor").addEventListener("input", (e) => {
      state.useManualBg = true;
      state.autoSample = false;
      state.manualBg = hexToRgb(e.target.value);
      setBgSwatch(state.manualBg);
      schedulePreviewSelected();
    });

    document.querySelectorAll(".preview-bg button").forEach((btn) => {
      btn.addEventListener("click", () => {
        state.previewBg = btn.dataset.bg;
        applyPreviewBgClass();
        renderFrame();
      });
    });

    $("#playBtn").addEventListener("click", () => {
      if (!state.items.length) return;
      state.isPlaying = !state.isPlaying;
      $("#playBtn").textContent = state.isPlaying ? "暂停" : "播放";
      state.lastFrameTime = 0;
    });
    $("#prevBtn").addEventListener("click", () => {
      if (!state.items.length) return;
      state.isPlaying = false;
      $("#playBtn").textContent = "播放";
      state.currentFrame = (state.currentFrame - 1 + state.items.length) % state.items.length;
      state.selectedId = state.items[state.currentFrame].id;
      renderFrame();
    });
    $("#nextBtn").addEventListener("click", () => {
      if (!state.items.length) return;
      state.isPlaying = false;
      $("#playBtn").textContent = "播放";
      state.currentFrame = (state.currentFrame + 1) % state.items.length;
      state.selectedId = state.items[state.currentFrame].id;
      renderFrame();
    });

    $("#fpsRange").addEventListener("input", (e) => {
      state.fps = +e.target.value;
      $("#fpsVal").textContent = state.fps;
      renderFrame();
    });
    $("#speedRange").addEventListener("input", (e) => {
      state.speed = +e.target.value;
      $("#speedVal").textContent = state.speed.toFixed(1) + "x";
    });
    $("#delayRange").addEventListener("input", (e) => {
      state.extraDelay = +e.target.value;
      $("#delayVal").textContent = state.extraDelay + " ms";
    });
    $("#playMode").addEventListener("change", (e) => {
      state.playMode = e.target.value;
      state.direction = 1;
    });
    $("#flipX").addEventListener("change", (e) => {
      state.flipX = e.target.value === "true";
      renderFrame();
    });

    $("#btnProcess").addEventListener("click", processAll);
    $("#btnDownload").addEventListener("click", downloadZip);
    $("#btnReprocessSel").addEventListener("click", async () => {
      const item = state.items[state.currentFrame];
      if (!item) return;
      setStatus("重算 " + item.name);
      await processItem(item);
      renderTimeline();
      renderFrame();
      setStatus("已重算 · " + item.name);
      updateButtons();
    });
    $("#btnCompare").addEventListener("click", () => openCompare(state.currentFrame));
    $("#btnClear").addEventListener("click", () => {
      state.items = [];
      state.selectedId = null;
      state.currentFrame = 0;
      state.isPlaying = true;
      $("#playBtn").textContent = "暂停";
      stage.width = 0;
      stage.height = 0;
      stageEmpty.style.display = "";
      renderTimeline();
      renderFrame();
      setStatus("已清空");
      updateButtons();
    });

    $("#exportBtn").addEventListener("click", () => {
      if (!state.items.length) return;
      buildSpriteSheet();
      $("#exportModal").classList.add("open");
    });
    $("#sheetLayout").addEventListener("change", buildSpriteSheet);
    $("#sheetOnlyProcessed").addEventListener("change", buildSpriteSheet);
    $("#downloadSheetBtn").addEventListener("click", () => {
      if (!sheetFrames().length) {
        alert("没有可导出的帧（可取消「仅已抠图」或先处理抠图）");
        return;
      }
      const a = document.createElement("a");
      a.download = "spritesheet.png";
      a.href = spriteCanvas.toDataURL("image/png");
      a.click();
    });

    const closeCompare = () => $("#compare").classList.remove("open");
    const closeExport = () => $("#exportModal").classList.remove("open");
    $("#btnCloseCompare").addEventListener("click", closeCompare);
    $("#closeModalBtn").addEventListener("click", closeExport);
    $("#closeModalBtn2").addEventListener("click", closeExport);
    $("#compare").addEventListener("click", (e) => { if (e.target.id === "compare") closeCompare(); });
    $("#exportModal").addEventListener("click", (e) => { if (e.target.id === "exportModal") closeExport(); });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") { closeCompare(); closeExport(); }
    });

    requestAnimationFrame(animLoop);
  </script>
</body>
</html>
