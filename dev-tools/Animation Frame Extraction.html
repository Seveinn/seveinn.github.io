<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seedance 视频/角色动画 FFmpeg 本地抽帧工具</title>
    <!-- 引入 FFmpeg.wasm 核心库 (CDN) -->
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg: #F9FAFB;
            --card: #FFFFFF;
            --text: #1F2937;
            --border: #E5E7EB;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .card {
            background: var(--card);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
            border: 1px solid var(--border);
            margin-bottom: 24px;
        }

        h1 { margin-top: 0; font-size: 1.5rem; color: var(--text); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.9rem; }
        
        input[type="file"], input[type="number"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            box-sizing: border-box;
            background: #FAFAFA;
        }

        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover { background-color: var(--primary-hover); }
        button:disabled { background-color: #A5B4FC; cursor: not-allowed; }

        #log {
            background: #1E293B;
            color: #38BDF8;
            padding: 12px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.85rem;
            height: 120px;
            overflow-y: auto;
            white-space: pre-wrap;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 12px;
            margin-top: 16px;
        }

        .gallery-item {
            border: 1px solid var(--border);
            border-radius: 6px;
            overflow: hidden;
            background: #000;
            position: relative;
        }

        .gallery-item img {
            width: 100%;
            height: 120px;
            object-fit: contain;
            display: block;
        }

        .gallery-item .info {
            background: rgba(0,0,0,0.7);
            color: white;
            font-size: 0.75rem;
            text-align: center;
            padding: 4px 0;
            position: absolute;
            bottom: 0;
            width: 100%;
        }

        .actions { margin-top: 16px; display: flex; gap: 12px; }
        .btn-secondary { background-color: #10B981; }
        .btn-secondary:hover { background-color: #059669; }
    </style>
</head>
<body>

    <div class="card">
        <h1>🎬 Seedance 动画帧提取工具 (FFmpeg.wasm)</h1>
        <p style="font-size: 0.85rem; color: #6B7280;">完全基于浏览器本地计算，视频无需上传服务器。</p>
        
        <div style="margin-bottom: 16px;">
            <label>选择视频文件 (MP4 / MOV)</label>
            <input type="file" id="videoInput" accept="video/*">
        </div>

        <div class="grid">
            <div>
                <label>目标帧率 (FPS)</label>
                <input type="number" id="fpsInput" value="12" min="1" max="60">
            </div>
            <div>
                <label>缩放分辨率 (宽)</label>
                <select id="scaleInput">
                    <option value="-1">保持原画质</option>
                    <option value="512">512px (适合 Sprite Sheet)</option>
                    <option value="256">256px (小图标/像素微调)</option>
                </select>
            </div>
        </div>

        <button id="startBtn" onclick="processVideo()">开始提取序列帧</button>
    </div>

    <div class="card">
        <label>控制台日志</label>
        <div id="log">准备就绪，请选择视频文件...</div>
    </div>

    <div class="card" id="outputCard" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2 style="font-size: 1.2rem; margin: 0;">提取结果 (<span id="frameCount">0</span> 帧)</h2>
            <button class="btn-secondary" onclick="downloadAll()" style="width: auto; padding: 8px 16px;">批量下载 PNG</button>
        </div>
        <div class="gallery" id="gallery"></div>
    </div>

    <script>
        const { createFFmpeg, fetchFile } = FFmpeg;
        const ffmpeg = createFFmpeg({ log: false });

        function log(msg) {
            const logDiv = document.getElementById('log');
            logDiv.innerText += '\n' + msg;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        async function processVideo() {
            const fileInput = document.getElementById('videoInput');
            const startBtn = document.getElementById('startBtn');
            const fps = document.getElementById('fpsInput').value;
            const scale = document.getElementById('scaleInput').value;

            if (!fileInput.files.length) {
                alert('请先选择视频文件！');
                return;
            }

            startBtn.disabled = true;
            document.getElementById('gallery').innerHTML = '';
            document.getElementById('outputCard').style.display = 'none';

            try {
                if (!ffmpeg.isLoaded()) {
                    log('正在加载 FFmpeg.wasm 引擎 (初次加载可能需要几秒)...');
                    await ffmpeg.load();
                }

                const file = fileInput.files[0];
                log(`读取文件: ${file.name}...`);
                ffmpeg.FS('writeFile', 'input.mp4', await fetchFile(file));

                // 构建 FFmpeg 滤镜指令
                let vfCommand = `fps=${fps}`;
                if (scale !== "-1") {
                    vfCommand += `,scale=${scale}:-1`;
                }

                log(`开始执行抽帧 (FPS: ${fps})...`);
                // 执行提取：导出为 frame_%03d.png
                await ffmpeg.run('-i', 'input.mp4', '-vf', vfCommand, 'frame_%03d.png');

                log('抽帧完成，解析生成图片中...');

                // 遍历获取生成的文件
                const files = ffmpeg.FS('readdir', '/');
                const frameFiles = files.filter(f => f.startsWith('frame_') && f.endsWith('.png'));
                
                document.getElementById('frameCount').innerText = frameFiles.length;
                const gallery = document.getElementById('gallery');

                for (let i = 0; i < frameFiles.length; i++) {
                    const fileName = frameFiles[i];
                    const data = ffmpeg.FS('readFile', fileName);
                    const blob = new Blob([data.buffer], { type: 'image/png' });
                    const url = URL.createObjectURL(blob);

                    const item = document.createElement('div');
                    item.className = 'gallery-item';
                    item.innerHTML = `
                        <img src="${url}" alt="${fileName}">
                        <div class="info">帧 #${i + 1}</div>
                    `;
                    item.dataset.url = url;
                    item.dataset.name = fileName;
                    gallery.appendChild(item);

                    // 清理 Virtual FileSystem 缓存
                    ffmpeg.FS('unlink', fileName);
                }

                // 清理输入文件
                ffmpeg.FS('unlink', 'input.mp4');

                document.getElementById('outputCard').style.display = 'block';
                log(`成功提取 ${frameFiles.length} 帧图像！`);

            } catch (err) {
                console.error(err);
                log(`发生错误: ${err.message}`);
            } finally {
                startBtn.disabled = false;
            }
        }

        // 批量下载提取到的图片
        function downloadAll() {
            const items = document.querySelectorAll('.gallery-item');
            if (!items.length) return;

            items.forEach((item, index) => {
                setTimeout(() => {
                    const a = document.createElement('a');
                    a.href = item.dataset.url;
                    a.download = item.dataset.name;
                    a.click();
                }, index * 200); // 间隔 200ms 防止浏览器阻塞多文件下载
            });
        }
    </script>
</body>
</html>
