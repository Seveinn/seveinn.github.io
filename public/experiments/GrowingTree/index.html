<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procedural Nature - Cluster Depth</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050505; 
            font-family: 'Segoe UI', sans-serif;
            color: #eee;
        }
        canvas { display: block; }
        
        #ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            width: auto;
            min-width: 200px;
            max-width: min(90vw, 360px);
            box-sizing: border-box;
            background: rgba(20, 20, 20, 0.9);
            backdrop-filter: blur(10px);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            gap: 12px;
            user-select: none;
            z-index: 10;
            overflow: auto; /* enable scrolling if content exceeds */
            -webkit-overflow-scrolling: touch;
        }
        
        .control-group { display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 12px; color: #888; font-weight: 600; letter-spacing: 0.5px; }

        select {
            width: 100%; padding: 8px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 6px; color: #fff; outline: none; cursor: pointer;
        }
        select:hover { border-color: #666; }

        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        .btn-group button { flex: 1 1 120px; min-width: 72px; box-sizing: border-box; }
        button {
            flex: 1; padding: 10px;
            background: linear-gradient(135deg, #3a3a3a, #2b2b2b);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff; cursor: pointer; border-radius: 6px; font-size: 12px;
            transition: all 0.2s;
        }
        button:hover { background: linear-gradient(135deg, #4a4a4a, #3a3a3a); transform: translateY(-1px); }
        button.active { background-color: #27ae60; border-color: #2ecc71; box-shadow: 0 0 12px rgba(39, 174, 96, 0.4); font-weight: bold; }

        .hint { font-size: 10px; color: #666; text-align: center; margin-top: -5px; line-height: 1.4; }

        input[type="range"] {
            width: 100%;
            height: 6px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 3px;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            background: #fff;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s;
        }
        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
        }
        input[type="range"]::-moz-range-thumb {
            width: 14px;
            height: 14px;
            background: #fff;
            border-radius: 50%;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }
        input[type="range"]::-moz-range-thumb:hover {
            transform: scale(1.2);
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
        }
        .slider-value {
            font-size: 11px;
            color: #aaa;
            text-align: right;
            margin-top: -3px;
        }
    </style>
</head>
<body>

    <div id="ui-panel">
        <div class="control-group">
            <label>生成模式 / Mode</label>
            <select id="mode-select">
                <option value="LEAF" selected>🍃 仅树叶 (Leaves)</option>
                <option value="MIXED">🌿 混合 (花 + 叶)</option>
                <option value="FLOWER">🌸 仅花朵 (Flowers)</option>
            </select>
        </div>

        <div class="control-group">
            <label>摇晃幅度 / Sway Amount</label>
            <input type="range" id="sway-slider" min="0" max="0.15" step="0.005" value="0.05">
            <div class="slider-value" id="sway-value">0.05</div>
        </div>

        <div class="btn-group">
            <button id="btn-random">🎲 随机变异</button>
            <button id="btn-replant">🌱 重新种植</button>
        </div>

        <div class="control-group">
            <label>模板 / Templates</label>
            <div class="btn-group" style="gap:6px;">
                <button class="template-btn" data-tpl="1" id="tpl1">1. L-System</button>
                <button class="template-btn" data-tpl="2" id="tpl2">2. Barnsley</button>
                <button class="template-btn" data-tpl="3" id="tpl3">3. DLA</button>
                <button class="template-btn" data-tpl="4" id="tpl4">4. Space Roots</button>
                <button id="btn-back" style="min-width: 70px;">↩ 主体</button>
            </div>
            <div class="hint-mini" style="font-size:11px;color:#777;margin-top:6px;">点击模板以在画布上呈现不同分形/生长样式</div>
        </div>

        <div class="hint">
            优化特性：<br>
            • 0-2级主干保持清晰<br>
            • 3级开始分配深度<br>
            • <strong>同簇枝干深度一致</strong> (更真实的虚化)<br>
            • 鼠标中键拖动可移动植物
        </div>
    </div>

    <canvas id="canvas"></canvas>

<script>
/**
 * Procedural Nature: Cluster Depth Inheritance Edition
 */

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const modeSelect = document.getElementById('mode-select');

let width, height;
let branches = [];
let elements = []; 
let seed = null;
let time = 0;
let stage = 'SEED';

// 鼠标拖动相关
let isDragging = false;
let dragOffsetX = 0;
let dragOffsetY = 0;
let lastMouseX = 0;
let lastMouseY = 0;
let rootBaseX = 0;  // 根节点的基准X位置
let rootBaseY = 0;  // 根节点的基准Y位置 

// --- 配置 ---

const envConfig = {
    maxGenerations: 8,      
    growSpeed: 0.035,
    branchAngle: 0.42,
    swaySpeed: 0.002,
    swayAmount: 0.05,  // 默认摇晃幅度增大
};

let geneConfig = { flower: {}, leaf: {} };
let currentMode = 'LEAF';

// View mode: 'GROW' for the original plant system, 'TEMPLATE' for the example templates
let currentView = 'GROW';
let currentTemplate = 1;
let templateAnimId = null;
let templateData = {};

// 深度透明度映射：0(清晰) -> 3(模糊/远)
// 调整了数值，让最远的更暗一点，增加层次感
const depthOpacity = [1.0, 0.7, 0.4, 0.12];

const randomRange = (min, max) => Math.random() * (max - min) + min;

function generateNewGenes() {
    geneConfig.flower = {
        petalCount: Math.floor(randomRange(5, 9)),
        petalLength: randomRange(8, 18),
        petalWidth: randomRange(3, 7),
        sharpness: randomRange(0.6, 2.0), 
        centerSize: randomRange(1.5, 3.5)
    };
    geneConfig.leaf = {
        size: randomRange(7, 14),
        widthRatio: randomRange(0.35, 0.6), 
        chanceAtJoint: randomRange(0.25, 0.5) 
    };
}

// --- 基础类 ---

class Seed {
    constructor(x, y) {
        this.x = x; this.y = 0; this.targetY = y;
        this.vy = 8; this.landed = false; this.alpha = 1;
    }
    update() {
        if (!this.landed) {
            this.y += this.vy;
            if (this.y >= this.targetY) {
                this.y = this.targetY; this.landed = true;
                startGrowth(this.x, this.y);
            }
        } else { this.alpha -= 0.05; }
    }
    draw(ctx) {
        if (this.alpha <= 0) return;
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.fillStyle = "#fff";
        ctx.shadowBlur = 10; ctx.shadowColor = "#fff";
        ctx.beginPath(); ctx.arc(this.x, this.y, 3, 0, Math.PI*2); ctx.fill();
        ctx.restore();
    }
}

class Leaf {
    constructor(x, y, angle, depth) {
        this.x = x; this.y = y; this.angle = angle;
        this.depth = depth; 
        this.finalSize = geneConfig.leaf.size * randomRange(0.8, 1.2);
        this.size = 0;
        this.wRatio = geneConfig.leaf.widthRatio;
    }
    update(pos) {
        this.x = pos.x; this.y = pos.y;
        if (this.size < this.finalSize) this.size += (this.finalSize - this.size) * 0.05;
    }
    draw(ctx) {
        if (this.size < 0.5) return;
        ctx.save();
        ctx.globalAlpha = depthOpacity[this.depth] || 0.1;
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle); 
        
        ctx.fillStyle = "rgba(255,255,255,0.2)"; 
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 0.5;
        
        const len = this.size;
        const wid = this.size * this.wRatio;

        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(len/2, -wid, len, 0, len, 0); 
        ctx.bezierCurveTo(len/2, wid, 0, 0, 0, 0);    
        ctx.fill();
        ctx.stroke();

        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(len * 0.7, 0); ctx.stroke();
        ctx.restore();
    }
}

class Flower {
    constructor(x, y, angle, depth) {
        this.x = x; this.y = y; this.angle = angle;
        this.depth = depth;
        this.cfg = {...geneConfig.flower}; 
        this.maxSize = 1 * randomRange(0.85, 1.15);
        this.size = 0;
    }
    update(pos) {
        this.x = pos.x; this.y = pos.y;
        if (this.size < this.maxSize) this.size += (this.maxSize - this.size) * 0.04;
    }
    draw(ctx) {
        if (this.size < 0.05) return;
        ctx.save();
        ctx.globalAlpha = depthOpacity[this.depth] || 0.1;
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle + Math.PI/2);
        ctx.scale(this.size, this.size); 

        ctx.strokeStyle = "#fff"; ctx.lineWidth = 0.5;
        ctx.shadowBlur = 5; ctx.shadowColor = "#fff";
        
        const { petalCount, petalLength, petalWidth, sharpness, centerSize } = this.cfg;

        for (let i = 0; i < petalCount; i++) {
            ctx.save();
            ctx.rotate((Math.PI * 2 / petalCount) * i);
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.bezierCurveTo(
                -petalWidth/2, -petalLength * (1-sharpness*0.5),
                -petalWidth/sharpness/3, -petalLength,
                0, -petalLength
            );
            ctx.bezierCurveTo(
                petalWidth/sharpness/3, -petalLength,
                petalWidth/2, -petalLength * (1-sharpness*0.5),
                0, 0
            );
            ctx.fillStyle = "rgba(255,255,255,0.15)";
            ctx.fill();
            ctx.stroke();
            ctx.restore();
        }
        ctx.beginPath(); ctx.arc(0, 0, centerSize, 0, Math.PI * 2);
        ctx.fillStyle = "#fff"; ctx.fill();
        ctx.restore();
    }
}

class Branch {
    // 增加 inheritedDepth 参数，默认为 null
    constructor(x, y, angle, length, generation, inheritedDepth = null) {
        this.x = x; this.y = y; 
        this.angle = angle; this.initialAngle = angle;
        this.length = length; 
        this.generation = generation;
        
        // --- 核心优化逻辑：深度遗传 ---
        if (this.generation < 3) {
            // Gen 0, 1, 2: 强制主干清晰
            this.zDepth = 0;
        } else if (this.generation === 3) {
            // Gen 3 (第4级): 决策层，随机分配深度
            this.zDepth = Math.floor(Math.random() * 4);
        } else {
            // Gen > 3: 必须继承父级的深度，保持簇的一致性
            // 兜底逻辑：如果没有父级深度(理论上不会发生)，默认为0
            this.zDepth = (inheritedDepth !== null) ? inheritedDepth : 0;
        }

        this.currentLength = 0;
        this.thickness = Math.max(0.2, (envConfig.maxGenerations - generation) * 0.6);
        this.grown = false;
        
        this.endX = x; this.endY = y;
        this.childBranches = [];
        this.endElement = null; 
        this.jointLeaf = null;  
        
        this.noiseOffset = Math.random() * 100;
    }

    update() {
        // 只有根节点应用拖动偏移
        if (this.generation === 0) {
            this.x = rootBaseX + dragOffsetX;
            this.y = rootBaseY + dragOffsetY;
        }

        if (this.currentLength < this.length) {
            this.currentLength += (this.length - this.currentLength) * envConfig.growSpeed + 0.15;
        } else if (!this.grown) {
            this.grown = true;
            
            if (this.generation < envConfig.maxGenerations) {
                this.spawnChildren();
                
                // 只有 generation >= 3 才生成树叶，保持主干干净
                if (this.generation >= 3 && shouldGenerateJointLeaf()) {
                    let dir = (Math.random() > 0.5 ? 1 : -1);
                    this.jointLeaf = new Leaf(this.endX, this.endY, this.angle + dir * Math.PI/3, this.zDepth);
                    elements.push(this.jointLeaf);
                }
            } 
            else {
                this.spawnEndElement();
            }
        }

        let sway = Math.sin(time * envConfig.swaySpeed + this.noiseOffset) * envConfig.swayAmount * (this.generation + 1);
        this.angle = this.initialAngle + sway;

        this.endX = this.x + Math.cos(this.angle) * this.currentLength;
        this.endY = this.y + Math.sin(this.angle) * this.currentLength;

        for (let b of this.childBranches) { 
            b.x = this.endX; 
            b.y = this.endY;
            b.update(); 
        }
        
        if (this.endElement) this.endElement.update({x: this.endX, y: this.endY});
        if (this.jointLeaf) this.jointLeaf.update({x: this.endX, y: this.endY});
    }

    spawnChildren() {
        const count = 2;
        for (let i=0; i<count; i++) {
            let dir = (i===0) ? 1 : -1;
            let offset = envConfig.branchAngle * dir + randomRange(-0.15, 0.15);
            let newLen = this.length * randomRange(0.75, 0.92);
            // --- 关键：将当前的 this.zDepth 传递给下一级 ---
            this.childBranches.push(
                new Branch(this.endX, this.endY, this.angle + offset, newLen, this.generation + 1, this.zDepth)
            );
        }
    }

    spawnEndElement() {
        let type = determineEndElementType();
        if (type === 'FLOWER') {
            this.endElement = new Flower(this.endX, this.endY, this.angle, this.zDepth);
        } else if (type === 'LEAF') {
            this.endElement = new Leaf(this.endX, this.endY, this.angle, this.zDepth);
        }
        if (this.endElement) elements.push(this.endElement);
    }

    draw(ctx) {
        ctx.save();
        
        const alpha = depthOpacity[this.zDepth] || 1.0;
        ctx.globalAlpha = alpha;

        ctx.beginPath();
        ctx.moveTo(this.x, this.y);
        let cx = (this.x + this.endX)/2 + Math.cos(this.angle+Math.PI/2)*(this.length*0.1);
        let cy = (this.y + this.endY)/2 + Math.sin(this.angle+Math.PI/2)*(this.length*0.1);
        ctx.quadraticCurveTo(cx, cy, this.endX, this.endY);
        
        ctx.strokeStyle = "#fff";
        // 远处的枝干稍微细一点
        ctx.lineWidth = this.thickness * (1 - this.zDepth * 0.15);
        ctx.lineCap = 'round';
        ctx.stroke();
        
        ctx.restore();

        for (let b of this.childBranches) b.draw(ctx);
    }
}

// --- 逻辑控制 ---

function shouldGenerateJointLeaf() {
    if (currentMode === 'FLOWER') return false; 
    if (currentMode === 'LEAF') return Math.random() < geneConfig.leaf.chanceAtJoint + 0.1; 
    return Math.random() < geneConfig.leaf.chanceAtJoint;
}

function determineEndElementType() {
    if (currentMode === 'FLOWER') return 'FLOWER';
    if (currentMode === 'LEAF') return 'LEAF';
    return Math.random() > 0.5 ? 'FLOWER' : 'LEAF';
}

// -------------------- Template integration --------------------
function clearCanvasFull() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, width, height);
}

function clearAndStopTemplate() {
    if (templateAnimId) {
        cancelAnimationFrame(templateAnimId);
        templateAnimId = null;
    }
    templateData = {};
    clearCanvasFull();
}

function switchTemplate(type) {
    currentView = 'TEMPLATE';
    currentTemplate = type;
    document.querySelectorAll('.template-btn').forEach((b) => {
        b.classList.toggle('active', b.dataset.tpl == type);
    });
    startTemplate(type);
}

function startTemplate(type) {
    clearAndStopTemplate();
    if (type === 1) drawLSystemStart();
    else if (type === 2) drawBarnsleyFernStart();
    else if (type === 3) initDLA();
    else if (type === 4) initSpaceRoots();
}

// 1) L-System (single draw)
function drawLSystemStart() {
    clearCanvasFull();

    // 规则
    const rules = { "X": "F-[[X]+X]+F[+FX]-X", "F": "FF" };
    let sentence = "X";
    const iterations = 5;
    for (let i = 0; i < iterations; i++) {
        let next = "";
        for (let char of sentence) next += rules[char] || char;
        sentence = next;
    }

    const len = height / 85;
    const angle = 25 * Math.PI / 180;

    ctx.save();
    ctx.translate(width / 2, height);
    ctx.strokeStyle = "#8ec5fc";
    ctx.lineWidth = 1;

    for (let char of sentence) {
        if (char === "F") {
            ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -len); ctx.stroke(); ctx.translate(0, -len);
        } else if (char === "+") ctx.rotate(angle);
        else if (char === "-") ctx.rotate(-angle);
        else if (char === "[") ctx.save();
        else if (char === "]") ctx.restore();
    }

    ctx.restore();
}

// 2) Barnsley Fern (single draw)
function drawBarnsleyFernStart() {
    clearCanvasFull();

    let x = 0, y = 0;
    const scale = height / 11;
    ctx.save();
    ctx.translate(width / 2, height);
    ctx.fillStyle = "#4caf50";

    for (let i = 0; i < 25000; i++) {
        let r = Math.random(), nx, ny;
        if (r < 0.01) { nx = 0; ny = 0.16 * y; }
        else if (r < 0.86) { nx = 0.85 * x + 0.04 * y; ny = -0.04 * x + 0.85 * y + 1.6; }
        else if (r < 0.93) { nx = 0.2 * x - 0.26 * y; ny = 0.23 * x + 0.22 * y + 1.6; }
        else { nx = -0.15 * x + 0.28 * y; ny = 0.26 * x + 0.24 * y + 0.44; }
        x = nx; y = ny; ctx.fillRect(x * scale, -y * scale, 1, 1);
    }

    ctx.restore();
}

// 3) DLA (animated)
function initDLA() {
    clearCanvasFull();
    const cx = width / 2, cy = height / 2;
    templateData.tree = [];
    ctx.fillStyle = "#aed581";
    templateData.tree.push({ x: cx, y: cy });
    ctx.fillRect(cx, cy, 2, 2);
    templateData.radius = 10;
    animateDLA();
}

function animateDLA() {
    for (let speed = 0; speed < 60; speed++) {
        if (templateData.tree && templateData.tree.length > 3000) return;
        let angle = Math.random() * Math.PI * 2;
        let r = templateData.radius + 10;
        let wx = width / 2 + Math.cos(angle) * r;
        let wy = height / 2 + Math.sin(angle) * r;
        let walking = true; let steps = 0;
        while (walking && steps < 200) {
            wx += (Math.random() - 0.5) * 4;
            wy += (Math.random() - 0.5) * 4;
            for (let i = (templateData.tree ? templateData.tree.length - 1 : -1); i >= 0; i--) {
                const p = templateData.tree[i];
                const dx = wx - p.x, dy = wy - p.y, distSq = dx * dx + dy * dy;
                if (distSq < 16) {
                    templateData.tree.push({ x: wx, y: wy });
                    const distFromCenter = Math.sqrt(Math.pow(wx - width / 2, 2) + Math.pow(wy - height / 2, 2));
                    ctx.fillStyle = `hsl(${80 + distFromCenter / 6}, 70%, ${60 - distFromCenter / 20}%)`;
                    ctx.fillRect(wx - 1, wy - 1, 3, 3);
                    if (distFromCenter > templateData.radius) templateData.radius = distFromCenter;
                    walking = false; break;
                }
            }
            if (wx < 0 || wx > width || wy < 0 || wy > height) walking = false;
            steps++;
        }
    }
    templateAnimId = requestAnimationFrame(animateDLA);
}

// 4) Space Roots (animated)
function initSpaceRoots() {
    clearCanvasFull();
    templateData.roots = [];
    templateData.roots.push({ x: width / 2, y: 0, angle: Math.PI / 2, life: 150, width: 5 });
    animateRoots();
}

function animateRoots() {
    let activeRoots = false;
    for (let i = templateData.roots.length - 1; i >= 0; i--) {
        let root = templateData.roots[i];
        if (root.life > 0) {
            activeRoots = true;
            let nx = root.x + Math.cos(root.angle) * 2;
            let ny = root.y + Math.sin(root.angle) * 2;
            ctx.beginPath(); ctx.moveTo(root.x, root.y); ctx.lineTo(nx, ny);
            ctx.strokeStyle = `rgba(210, 180, 140, ${Math.min(1, root.life / 50)})`;
            ctx.lineWidth = root.width; ctx.lineCap = "round"; ctx.stroke();
            root.x = nx; root.y = ny; root.life -= 0.5; root.width *= 0.992;
            root.angle += (Math.random() - 0.5) * 0.4;
            if (Math.random() < 0.02 && root.width > 1) {
                templateData.roots.push({ x: root.x, y: root.y, angle: root.angle + (Math.random() * 1.0 - 0.5), life: root.life * 0.7, width: root.width * 0.7 });
            }
        }
    }
    if (activeRoots) templateAnimId = requestAnimationFrame(animateRoots);
}

// -------------------------------------------------------------

function init() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    
    currentMode = modeSelect.value;
    generateNewGenes();
    reset();
    animate();
}

function reset() {
    branches = [];
    elements = [];
    time = 0;
    dragOffsetX = 0;
    dragOffsetY = 0;
    rootBaseX = width/2;
    rootBaseY = height - 80;
    seed = new Seed(rootBaseX, rootBaseY);
    stage = 'SEED';
}

function startGrowth(x, y) {
    stage = 'GROW';
    rootBaseX = x;
    rootBaseY = y;
    // 根节点不需要继承深度，传 null 即可
    let root = new Branch(x, y, -Math.PI/2, height/6, 0);
    branches.push(root);
}

function animate() {
    ctx.globalAlpha = 1.0;
    if (currentView === 'GROW') {
        ctx.fillStyle = '#050505';
        ctx.fillRect(0, 0, width, height);
        time++;

        if (seed) { seed.update(); seed.draw(ctx); }

        if (stage === 'GROW') {
            for (let b of branches) { b.update(); b.draw(ctx); }
            for (let el of elements) el.draw(ctx);
        }
    }
    requestAnimationFrame(animate);
}

// UI Events
modeSelect.addEventListener('change', (e) => {
    currentMode = e.target.value;
    // Switch back to main plant view and stop any template animations
    currentView = 'GROW';
    clearAndStopTemplate();
    reset();
});

// Template button hooks
document.querySelectorAll('.template-btn').forEach(b => {
    b.addEventListener('click', () => switchTemplate(parseInt(b.dataset.tpl)));
});
document.getElementById('btn-back').addEventListener('click', () => {
    currentView = 'GROW';
    clearAndStopTemplate();
    reset();
    document.querySelectorAll('.template-btn').forEach(b => b.classList.remove('active'));
});

const swaySlider = document.getElementById('sway-slider');
const swayValue = document.getElementById('sway-value');
swaySlider.addEventListener('input', (e) => {
    envConfig.swayAmount = parseFloat(e.target.value);
    swayValue.textContent = envConfig.swayAmount.toFixed(3);
});

document.getElementById('btn-random').onclick = () => {
    generateNewGenes();
    reset(); 
};
document.getElementById('btn-replant').onclick = reset;

// 鼠标中键拖动事件
canvas.addEventListener('mousedown', (e) => {
    if (e.button === 1) {  // 中键
        e.preventDefault();
        isDragging = true;
        lastMouseX = e.clientX;
        lastMouseY = e.clientY;
        canvas.style.cursor = 'grabbing';
    }
});

canvas.addEventListener('mousemove', (e) => {
    if (isDragging) {
        const deltaX = e.clientX - lastMouseX;
        const deltaY = e.clientY - lastMouseY;
        dragOffsetX += deltaX;
        dragOffsetY += deltaY;
        lastMouseX = e.clientX;
        lastMouseY = e.clientY;
    }
});

canvas.addEventListener('mouseup', (e) => {
    if (e.button === 1) {
        isDragging = false;
        canvas.style.cursor = 'default';
    }
});

canvas.addEventListener('mouseleave', () => {
    isDragging = false;
    canvas.style.cursor = 'default';
});

// 阻止中键默认行为（防止页面滚动）
canvas.addEventListener('contextmenu', (e) => e.preventDefault());
canvas.addEventListener('auxclick', (e) => {
    if (e.button === 1) e.preventDefault();
});

window.addEventListener('resize', () => {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    // If a template is active, restart it to adapt to new size
    if (currentView === 'TEMPLATE') startTemplate(currentTemplate);
});

init();

</script>
