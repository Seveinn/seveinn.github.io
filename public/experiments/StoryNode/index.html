<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>StoryNode · 剧情节点生成器</title>
  <style>
    :root{--bg:#f5f7f8;--panel:#fff;--ink:#263746;--muted:#718096;--line:#263746;--accent:#2585c4;--border:#dce3e8;--node-scale:1}
    *{box-sizing:border-box;margin:0;padding:0}body{width:100vw;height:100vh;display:flex;flex-direction:column;overflow:hidden;color:var(--ink);background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
    header{min-height:58px;padding:8px 18px;display:flex;align-items:center;justify-content:space-between;gap:18px;z-index:100;border-bottom:2px solid var(--line);background:var(--panel)}
    .brand{display:flex;align-items:center;gap:9px;white-space:nowrap;font-size:18px;font-weight:800}.badge{padding:3px 7px;border-radius:3px;color:#fff;background:var(--line);font-size:9px;letter-spacing:.1em}.toolbar{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}
    button{padding:7px 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--line);border:2px solid var(--line);border-radius:5px;background:var(--panel);font-size:12px;font-weight:700;cursor:pointer;transition:.15s}button:hover{color:#fff;background:var(--line)}button.primary{color:#fff;background:var(--line)}button.danger{color:#c43c3c;border-color:#c43c3c}.icon-btn{width:32px;height:32px;padding:0;font-size:18px}.text-size{padding:4px 9px;display:flex;align-items:center;gap:7px;border:1px solid var(--border);border-radius:6px;color:var(--muted);font-size:11px;font-weight:700;white-space:nowrap}.text-size input{width:100px;accent-color:var(--accent)}.text-size output{min-width:34px;color:var(--ink)}
    #workspace{position:relative;flex:1;overflow:hidden;touch-action:none;cursor:grab;background-image:radial-gradient(circle,#cbd5e1 1px,transparent 1px);background-size:24px 24px}#workspace.panning{cursor:grabbing}#scene,#canvas-svg{position:absolute;inset:0;width:100%;height:100%;transform-origin:0 0;overflow:visible}#canvas-svg{pointer-events:none}.node-link{fill:none;stroke:var(--line);stroke-width:2}.node-card{position:absolute;width:280px;padding:14px;user-select:none;cursor:pointer;border:2px solid var(--line);border-radius:7px;background:var(--panel);box-shadow:0 5px 14px rgba(0,0,0,.07);font-size:calc(14px * var(--node-scale))}.node-card:hover{box-shadow:0 8px 22px rgba(0,0,0,.12)}.node-card.selected{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,133,196,.25)}.node-card.root{border-width:3px;border-color:#10a875}.node-header{padding-bottom:7px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid var(--border)}.node-title{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:1em;font-weight:800}.node-tag{padding:2px 5px;white-space:nowrap;border:1px solid #cbd5e1;border-radius:3px;background:#f1f5f9;font-size:.72em;font-weight:700}.node-body{height:calc(72px * var(--node-scale));overflow:hidden;color:#475569;font-size:.86em;line-height:1.5}.node-footer{margin-top:9px;color:var(--muted);font-size:.75em}.status-dot{width:6px;height:6px;display:inline-block;margin-right:4px;border-radius:50%;background:#10a875}
    .drawer{position:fixed;right:-430px;top:58px;width:min(400px,100vw);height:calc(100vh - 58px);padding:20px;z-index:90;display:flex;flex-direction:column;border-left:2px solid var(--line);background:var(--panel);transition:right .25s}.drawer.open{right:0}.drawer-head{padding-bottom:12px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid var(--line)}.drawer-scroll{flex:1;overflow:auto}.form-group{margin-bottom:15px}.form-group label{display:block;margin-bottom:6px;font-size:12px;font-weight:800}.form-group input,.form-group textarea,.form-group select{width:100%;padding:9px 10px;border:2px solid var(--line);border-radius:5px;background:#fff;outline:none;font:13px inherit}.form-group small{display:block;margin-top:5px;color:var(--muted);font-size:10px;line-height:1.5}.secret-field{position:relative}.secret-field input{padding-right:45px}.secret-toggle{position:absolute;right:4px;top:4px;width:36px;height:calc(100% - 8px);padding:0;border:0;border-left:1px solid var(--border);border-radius:0 3px 3px 0;background:#fff;font-size:17px}.secret-toggle:hover{color:var(--accent);background:#eef5f8}.drawer-actions{padding-top:14px;display:grid;gap:8px;border-top:1px solid var(--border)}
    .overlay{position:fixed;inset:0;padding:18px;z-index:200;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;background:rgba(0,0,0,.44);transition:opacity .2s}.overlay.active{opacity:1;pointer-events:auto}#download-guard-modal{z-index:210}.modal{width:min(580px,96vw);max-height:92vh;overflow:auto;border:2px solid var(--line);border-radius:9px;background:var(--panel)}.modal-head,.modal-foot{padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px}.modal-head{border-bottom:2px solid var(--line);background:#f7f9fa}.modal-body{padding:18px}.modal-foot{justify-content:flex-end;border-top:1px solid var(--border)}.status{min-height:18px;margin-top:8px;color:var(--muted);font-size:11px}.status.ok{color:#16845e}.status.error{color:#c43c3c}.empty-hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:var(--muted);font-size:13px;pointer-events:none}.story-modal{width:min(920px,96vw);height:min(820px,92vh);overflow:hidden;display:flex;flex-direction:column}.story-meta{font-size:11px;color:var(--muted);font-weight:500}.story-preview-body{min-height:0;flex:1;display:flex;flex-direction:column;background:#eef2f4}.story-progress{padding:9px 18px;display:flex;align-items:center;gap:9px;color:var(--muted);border-bottom:1px solid var(--border);background:#fff;font-size:11px}.typing-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 rgba(37,133,196,.4);animation:pulse 1.2s infinite}.story-progress.idle .typing-dot{background:#a0aec0;animation:none}.story-progress.done .typing-dot{background:#10a875;animation:none}.story-progress.error .typing-dot{background:#c43c3c;animation:none}.story-paper{min-height:0;flex:1;margin:18px;padding:28px 34px;overflow:auto;white-space:pre-wrap;color:#253443;border:1px solid #d6dde2;border-radius:5px;background:#fff;box-shadow:0 8px 30px rgba(38,55,70,.08);font:15px/1.85 Georgia,'Noto Serif SC','Microsoft YaHei',serif}.story-paper.typing::after{content:'▋';color:var(--accent);animation:blink .75s infinite}.story-controls,.story-export{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.story-controls label,.story-export label{color:var(--muted);font-size:11px;font-weight:700}.story-controls select,.story-export select{padding:7px 9px;border:2px solid var(--line);border-radius:5px;background:#fff;font:12px inherit}.story-modal button:disabled,.story-modal select:disabled{opacity:.45;cursor:not-allowed}@keyframes blink{50%{opacity:0}}@keyframes pulse{70%{box-shadow:0 0 0 7px rgba(37,133,196,0)}}
    @media(max-width:900px){header{align-items:flex-start}.brand .badge{display:none}.toolbar button span{display:none}.text-size input{width:72px}}@media(max-width:620px){header{padding:7px 9px}.brand{font-size:15px}.toolbar{gap:5px}.text-size{order:10;width:100%}.text-size input{flex:1}.drawer{top:92px;height:calc(100vh - 92px)}}
  </style>
</head>
<body>
  <header>
    <div class="brand">◉ StoryNode <span class="badge">AI STORY GRAPH</span></div>
    <div class="toolbar">
      <button id="add-root">＋ <span>重置根节点</span></button>
      <button id="reset-view">⌖ <span>视角复位</span></button>
      <label class="text-size" for="text-scale">文本尺寸 <input id="text-scale" type="range" min="85" max="150" step="1" value="100" /><output id="text-scale-value">100%</output></label>
      <button id="api-settings">⚙ <span>AI 接口配置</span></button>
      <button id="export-json">⇩ <span>导出节点</span></button>
      <button id="print-story" class="primary">▤ <span>生成剧本</span></button>
    </div>
  </header>
  <main id="workspace" aria-label="剧情节点画布">
    <svg id="canvas-svg"></svg><div id="scene"></div>
  </main>

  <aside class="drawer" id="drawer">
    <div class="drawer-head"><strong id="drawer-title">节点编辑</strong><button id="close-drawer" class="icon-btn" aria-label="关闭">×</button></div>
    <div class="drawer-scroll">
      <div class="form-group"><label for="node-title">节点标题</label><input id="node-title" /></div>
      <div class="form-group"><label for="node-content">剧情梗概 / AI 演算结果</label><textarea id="node-content" rows="8"></textarea></div>
      <div class="form-group"><label for="node-prompt">补充约束 / 玩家决策</label><textarea id="node-prompt" rows="4" placeholder="例如：玩家决定向左走向悬崖……"></textarea></div>
    </div>
    <div class="drawer-actions"><button id="generate" class="primary">基于此节点 AI 演算 3 个分支</button><button id="save-node">保存修改</button><button id="delete-node" class="danger">删除当前节点及子节点</button></div>
  </aside>

  <div class="overlay" id="api-modal" role="dialog" aria-modal="true" aria-labelledby="api-title">
    <section class="modal">
      <div class="modal-head"><strong id="api-title">AI 接口配置</strong><button id="close-api" class="icon-btn" aria-label="关闭">×</button></div>
      <div class="modal-body">
        <div class="form-group"><label for="api-preset">接口预设</label><select id="api-preset"><option value="deepseek" selected>DeepSeek（默认）</option><option value="custom">OpenAI-compatible（自定义）</option><option value="openai">OpenAI</option><option value="moonshot">Moonshot</option></select></div>
        <div class="form-group"><label for="api-url">Chat Completions 地址</label><input id="api-url" type="url" placeholder="https://api.openai.com/v1/chat/completions" /></div>
        <div class="form-group"><label for="api-key">DeepSeek API Key</label><div class="secret-field"><input id="api-key" type="password" autocomplete="new-password" spellcheck="false" placeholder="粘贴控制台创建的 sk-… 密钥（不是文档网址）" /><button id="toggle-api-key" class="secret-toggle" type="button" aria-label="显示 API Key" aria-pressed="false" title="显示 API Key">◉</button></div><small>请在 <a href="https://platform.deepseek.com/api_keys" target="_blank" rel="noreferrer">DeepSeek 开放平台</a>创建密钥。配置仅保存在当前浏览器 localStorage，并由浏览器直接请求接口。</small></div>
        <div class="form-group"><label for="api-model">模型</label><input id="api-model" placeholder="deepseek-v4-flash" /></div>
        <div class="form-group"><label for="api-temp">创造性 <output id="temp-value">0.8</output></label><input id="api-temp" type="range" min="0" max="1.5" step="0.1" value="0.8" /></div>
        <div class="form-group"><label for="system-prompt">系统提示词</label><textarea id="system-prompt" rows="4"></textarea></div>
        <div id="api-status" class="status"></div>
      </div>
      <div class="modal-foot"><button id="test-api">测试连接</button><button id="save-api" class="primary">保存配置</button></div>
    </section>
  </div>


  <div class="overlay" id="story-modal" role="dialog" aria-modal="true" aria-labelledby="story-title">
    <section class="modal story-modal">
      <div class="modal-head"><div><strong id="story-title">完整剧本预览</strong><div id="story-meta" class="story-meta"></div></div><div class="story-controls"><label for="story-type">剧本类型</label><select id="story-type"><option value="novel">小说</option><option value="stage">舞台剧</option><option value="screenplay">影视剧本</option><option value="storyboard">分镜头脚本</option><option value="audio">广播剧</option></select><label for="story-language">预览文字</label><select id="story-language"><option value="simplified">简体中文</option><option value="traditional">繁體中文</option></select><button id="close-story" class="icon-btn" aria-label="关闭">×</button></div></div>
      <div class="story-preview-body"><div id="story-progress" class="story-progress idle"><span class="typing-dot"></span><span id="story-status">选择剧本类型后开始生成</span></div><article id="story-paper" class="story-paper" aria-live="polite">当前剧情链已准备完成。</article></div>
      <div class="modal-foot"><button id="clear-story" class="danger" type="button" disabled>清空预览</button><button id="regenerate-story" class="primary" type="button">开始生成</button><div class="story-export"><label for="story-format">导出格式</label><select id="story-format" disabled><option value="txt">TXT 纯文本</option><option value="md">Markdown</option><option value="html">HTML 网页</option></select><button id="download-story" class="primary" disabled>下载剧本</button></div></div>
    </section>
  </div>

  <div class="overlay" id="download-guard-modal" role="dialog" aria-modal="true" aria-labelledby="download-guard-title">
    <section class="modal">
      <div class="modal-head"><strong id="download-guard-title">下载校验</strong><button id="close-download-guard" class="icon-btn" aria-label="关闭">×</button></div>
      <div class="modal-body">
        <div class="form-group"><label for="download-pass">请输入下载密码</label><div class="secret-field"><input id="download-pass" type="password" autocomplete="off" spellcheck="false" placeholder="输入密码后允许下载" /><button id="toggle-download-pass" class="secret-toggle" type="button" aria-label="显示密码" aria-pressed="false" title="显示密码">◉</button></div><small>临时校验功能：密码正确后方可导出剧本文件。</small></div>
        <div id="download-guard-status" class="status"></div>
      </div>
      <div class="modal-foot"><button id="cancel-download-guard" type="button">取消</button><button id="confirm-download-guard" class="primary" type="button">确认下载</button></div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/full.js"></script>
  <script>
    const $=id=>document.getElementById(id), STORAGE='storynode:data:v1', CONFIG='storynode:ai:v1', STORY_CACHE='storynode:story:v1';
    let nodes={},selected=null,view={x:70,y:70,zoom:1},panning=null,generatedStory='',storyChain=[],storyAbort=null;
    const storyTypes={novel:{label:'小说',guide:'以小说体裁创作，重视叙事视角、氛围、人物心理、动作细节与章节节奏。'},stage:{label:'舞台剧',guide:'以舞台剧格式创作，包含幕、场、舞台布景、灯光音效提示、人物动作和对白。'},screenplay:{label:'影视剧本',guide:'以影视剧本格式创作，包含场次、内外景、时间、动作描述、人物对白与必要转场。'},storyboard:{label:'分镜头脚本',guide:'以可执行的分镜头表述创作，逐镜列出镜号、景别、画面、机位或运动、人物动作、对白、音效和建议时长。'},audio:{label:'广播剧',guide:'以广播剧格式创作，突出对白、旁白、环境音、音效、音乐和听觉转场。'}};
    let traditionalConverter=null;const toTraditional=()=>traditionalConverter||(traditionalConverter=window.OpenCC?.Converter?window.OpenCC.Converter({from:'cn',to:'tw'}):null);
    const defaults={url:'https://api.deepseek.com/chat/completions',key:'',model:'deepseek-v4-flash',temperature:.8,system:'你是一名互动叙事设计师。根据当前剧情生成三个差异明显、逻辑连贯且可继续发展的剧情分支。'};
    const presets={deepseek:{url:'https://api.deepseek.com/chat/completions',model:'deepseek-v4-flash'},openai:{url:'https://api.openai.com/v1/chat/completions',model:'gpt-4.1-mini'},moonshot:{url:'https://api.moonshot.cn/v1/chat/completions',model:'moonshot-v1-8k'}};
    const escapeHtml=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    function root(){return{id:'node_root',title:'根节点：迷雾森林起点',content:'你醒来在一片弥漫着淡蓝色雾气的森林边缘，手里握着一把微微发烫的铜匙。前方有三条小径，分别通向古堡、溪流与雪山。',prompt:'',parentId:null,children:[],x:80,y:110,depth:0}}
    function init(confirmReset=false){if(confirmReset&&Object.keys(nodes).length&&!confirm('确定清空所有剧情节点并重建根节点吗？'))return;nodes={node_root:root()};selected='node_root';view={x:60,y:55,zoom:1};save();render();openNode('node_root')}
    function save(){localStorage.setItem(STORAGE,JSON.stringify({nodes,view,textScale:Number($('text-scale').value)}))}
    function load(){try{const d=JSON.parse(localStorage.getItem(STORAGE));if(d?.nodes&&Object.keys(d.nodes).length){nodes=d.nodes;view=d.view||view;$('text-scale').value=d.textScale||100;setTextScale();return}}catch(e){}init()}
    function setTextScale(){const n=Number($('text-scale').value);document.documentElement.style.setProperty('--node-scale',n/100);$('text-scale-value').value=n+'%';render();save()}
    function transform(){const t=`translate(${view.x}px,${view.y}px) scale(${view.zoom})`;$('scene').style.transform=t;$('canvas-svg').style.transform=t;$('workspace').style.backgroundPosition=`${view.x}px ${view.y}px`;$('workspace').style.backgroundSize=`${24*view.zoom}px ${24*view.zoom}px`}
    function render(){const scene=$('scene'),svg=$('canvas-svg');scene.innerHTML='';svg.innerHTML='';Object.values(nodes).forEach(n=>{const card=document.createElement('article');card.className=`node-card ${n.id===selected?'selected':''} ${!n.parentId?'root':''}`;card.style.left=n.x+'px';card.style.top=n.y+'px';card.dataset.id=n.id;card.innerHTML=`<div class="node-header"><span class="node-title">${escapeHtml(n.title)}</span><span class="node-tag">Depth ${n.depth}</span></div><div class="node-body">${escapeHtml(n.content)}</div><div class="node-footer"><span class="status-dot"></span>${n.children.length} 个分支</div>`;card.addEventListener('pointerdown',e=>{e.stopPropagation()});card.addEventListener('click',e=>{e.stopPropagation();openNode(n.id)});scene.appendChild(card)});requestAnimationFrame(drawLines);transform()}
    function drawLines(){const svg=$('canvas-svg');svg.innerHTML='';Object.values(nodes).forEach(n=>{if(!n.parentId||!nodes[n.parentId])return;const p=nodes[n.parentId],x1=p.x+280,y1=p.y+90,x2=n.x,y2=n.y+90,m=(x1+x2)/2,path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d',`M${x1},${y1} C${m},${y1} ${m},${y2} ${x2},${y2}`);path.setAttribute('class','node-link');svg.appendChild(path)})}
    function openNode(id){selected=id;const n=nodes[id];if(!n)return;$('drawer-title').textContent=`节点编辑 · Depth ${n.depth}`;$('node-title').value=n.title;$('node-content').value=n.content;$('node-prompt').value=n.prompt||'';$('drawer').classList.add('open');render()}
    function saveNode(){const n=nodes[selected];if(!n)return;n.title=$('node-title').value.trim()||'未命名节点';n.content=$('node-content').value.trim();n.prompt=$('node-prompt').value.trim();save();render()}
    function deleteBranch(id){[...(nodes[id]?.children||[])].forEach(deleteBranch);delete nodes[id]}
    function deleteNode(){const n=nodes[selected];if(!n||!n.parentId)return alert('根节点不能删除，请使用“重置根节点”。');if(!confirm('确定删除此节点及全部子节点吗？'))return;const p=nodes[n.parentId];p.children=p.children.filter(id=>id!==selected);deleteBranch(selected);selected=p.id;save();openNode(p.id)}
    function config(){try{return{...defaults,...JSON.parse(localStorage.getItem(CONFIG)||'{}')}}catch(e){return{...defaults}}}
    function fillConfig(){const c=config();$('api-url').value=c.url;$('api-key').value=c.key;$('api-model').value=c.model;$('api-temp').value=c.temperature;$('temp-value').value=c.temperature;$('system-prompt').value=c.system}
    function readConfig(){return{url:$('api-url').value.trim(),key:$('api-key').value.trim(),model:$('api-model').value.trim(),temperature:Number($('api-temp').value),system:$('system-prompt').value.trim()}}
    function validateConfig(c){if(!/^https:\/\//i.test(c.url))throw new Error('接口地址必须使用 HTTPS');if(!c.key)throw new Error('请填写 DeepSeek 控制台签发的 API Key');if(/(?:https?:\/\/|api-docs\.|deepseek\.com\/zh-cn)/i.test(c.key))throw new Error('API Key 字段中填入了网页地址。请前往 DeepSeek 开放平台创建并粘贴 sk-… 密钥，而不是文档网址');if(/^Bearer\s+/i.test(c.key))throw new Error('API Key 无需填写“Bearer ”前缀，请只粘贴密钥本身');if(!c.model)throw new Error('请填写模型名称')}
    async function callAI(messages,max_tokens=1200,systemOverride=''){const c=readConfig();validateConfig(c);const res=await fetch(c.url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${c.key}`},body:JSON.stringify({model:c.model,temperature:c.temperature,max_tokens,messages:[{role:'system',content:systemOverride||c.system},...messages]})});const raw=await res.text();let data;try{data=JSON.parse(raw)}catch(e){throw new Error(`接口返回了非 JSON 内容（HTTP ${res.status}）`)}if(!res.ok)throw new Error(data.error?.message||`请求失败（HTTP ${res.status}）`);const content=data.choices?.[0]?.message?.content;if(!content)throw new Error('响应中没有可用文本');return content}
    function parseBranches(text){const cleaned=text.replace(/^```(?:json)?/i,'').replace(/```$/,'').trim();try{const d=JSON.parse(cleaned),arr=Array.isArray(d)?d:d.branches;if(Array.isArray(arr)&&arr.length)return arr.slice(0,3).map((v,i)=>({title:String(v.title||`分支 ${i+1}`),content:String(v.content||v.summary||'')}))}catch(e){}return text.split(/\n(?=\s*(?:\d+[.、]|[-*]))/).filter(Boolean).slice(0,3).map((v,i)=>({title:`分支 ${i+1}`,content:v.replace(/^\s*(?:\d+[.、]|[-*])\s*/,'').trim()}))}
    async function generate(){saveNode();const n=nodes[selected],button=$('generate'),c=config();fillConfig();try{validateConfig(c)}catch(e){$('api-modal').classList.add('active');setStatus(e.message,'error');return}button.disabled=true;button.textContent='AI 正在演算…';try{const text=await callAI([{role:'user',content:`当前节点标题：${n.title}\n剧情内容：${n.content}\n玩家决策或约束：${n.prompt||'无'}\n请输出严格 JSON：{"branches":[{"title":"标题","content":"剧情梗概"}]}，必须恰好三个分支。`}]);const branches=parseBranches(text);if(branches.length<3)throw new Error('模型未返回三个可解析的剧情分支，请重试');n.children.forEach(deleteBranch);n.children=[];branches.forEach((b,i)=>{const id='node_'+Date.now()+'_'+i;n.children.push(id);nodes[id]={id,title:b.title,content:b.content,prompt:'',parentId:n.id,children:[],x:n.x+390,y:n.y+(i-1)*210,depth:n.depth+1}});save();render()}catch(e){alert('生成失败：'+e.message)}finally{button.disabled=false;button.textContent='基于此节点 AI 演算 3 个分支'}}
    function setStatus(message,type=''){$('api-status').textContent=message;$('api-status').className='status '+type}
    async function testApi(){const b=$('test-api');b.disabled=true;setStatus('正在测试连接…');try{const text=await callAI([{role:'user',content:'只回复 OK'}],16);setStatus('连接成功：'+text.slice(0,40),'ok')}catch(e){setStatus(e.message,'error')}finally{b.disabled=false}}
    function exportJson(){const blob=new Blob([JSON.stringify({name:'StoryNode',version:1,exportedAt:new Date().toISOString(),nodes},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='storynode-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}
    function traceSelectedChain(){const leaf=nodes[selected];if(!leaf)throw new Error('请先选择一个剧情节点');if(leaf.children.length)throw new Error('请选择没有后续分支的末尾子节点，再生成完整剧本');const chain=[],seen=new Set();let current=leaf;while(current){if(seen.has(current.id))throw new Error('节点关系中存在循环，无法回溯');seen.add(current.id);chain.unshift(current);current=current.parentId?nodes[current.parentId]:null}if(!chain.length||chain[0].parentId)throw new Error('无法从所选节点回溯到根节点');return chain}
    function chainText(chain){return chain.map((n,i)=>`【节点 ${i+1} / Depth ${n.depth}】\n标题：${n.title}\n剧情信息：${n.content||'无'}\n玩家决策或约束：${n.prompt||'无'}`).join('\n\n')}
    function setStoryState(message,state=''){$('story-status').textContent=message;$('story-progress').className='story-progress '+state}
    function chainSignature(chain){return chain.map(n=>n.id).join('|')}
    function sameStoryChain(chain,ids){return ids?.length&&chainSignature(chain)===ids.join('|')}
    function loadStoryCache(){try{const d=JSON.parse(localStorage.getItem(STORY_CACHE));return d?.text?d:null}catch(e){return null}}
    function saveStoryCache(){if(!generatedStory||!storyChain.length)return;localStorage.setItem(STORY_CACHE,JSON.stringify({text:generatedStory,type:$('story-type').value,language:$('story-language').value,chainIds:storyChain.map(n=>n.id),chainPath:storyChain.map(n=>n.title).join(' → '),savedAt:new Date().toISOString()}))}
    function clearStoryCache(){localStorage.removeItem(STORY_CACHE)}
    function updateStoryActions(){const has=!!generatedStory;$('story-format').disabled=!has;$('download-story').disabled=!has;$('clear-story').disabled=!has;$('regenerate-story').textContent=has?'重新生成':'开始生成'}
    function restoreStoryFromCache(cache){generatedStory=cache.text;$('story-type').value=cache.type||'novel';$('story-language').value=cache.language||'simplified';renderStoryPreview();updateStoryActions();setStoryState(`${storyTypes[cache.type||'novel']?.label||'剧本'}已恢复上次生成内容`,'done')}
    function resetStoryPreview(){generatedStory='';$('story-paper').textContent='当前剧情链已准备完成。请选择剧本类型，然后点击“开始生成”。';updateStoryActions();setStoryState('选择剧本类型后开始生成','idle')}
    function clearStoryPreview(){if(!generatedStory&&!loadStoryCache())return;if(!confirm('确定清空当前剧本预览内容吗？'))return;clearStoryCache();resetStoryPreview()}
    function previewText(){if($('story-language').value==='simplified')return generatedStory;const converter=toTraditional();return converter?converter(generatedStory):generatedStory}
    function renderStoryPreview(follow=false){const paper=$('story-paper');paper.textContent=previewText();if(follow)paper.scrollTop=paper.scrollHeight}
    async function callAIStream(messages,max_tokens,systemOverride,onChunk,signal){const c=readConfig();validateConfig(c);const res=await fetch(c.url,{method:'POST',signal,headers:{'Content-Type':'application/json','Authorization':`Bearer ${c.key}`},body:JSON.stringify({model:c.model,temperature:c.temperature,max_tokens,stream:true,messages:[{role:'system',content:systemOverride||c.system},...messages]})});if(!res.ok){const raw=await res.text();let data;try{data=JSON.parse(raw)}catch(e){}throw new Error(data?.error?.message||`请求失败（HTTP ${res.status}）`)}const type=res.headers.get('content-type')||'';if(!type.includes('text/event-stream')){const data=await res.json(),text=data.choices?.[0]?.message?.content;if(!text)throw new Error('响应中没有可用文本');onChunk(text);return}if(!res.body)throw new Error('浏览器无法读取流式响应');const reader=res.body.getReader(),decoder=new TextDecoder(),consume=line=>{const value=line.trim();if(!value.startsWith('data:'))return false;const data=value.slice(5).trim();if(data==='[DONE]')return true;try{const json=JSON.parse(data),delta=json.choices?.[0]?.delta?.content;if(delta)onChunk(delta);if(json.error)throw new Error(json.error.message||'流式生成失败')}catch(e){if(e instanceof SyntaxError)return false;throw e}return false};let buffer='',done=false;while(!done){const result=await reader.read();buffer+=decoder.decode(result.value||new Uint8Array(),{stream:!result.done});const lines=buffer.split(/\r?\n/);buffer=lines.pop()||'';for(const line of lines){if(consume(line)){done=true;break}}if(result.done)break}if(buffer)consume(buffer)}
    function openStorySetup(){try{if($('drawer').classList.contains('open'))saveNode();storyChain=traceSelectedChain()}catch(e){alert(e.message);return}fillConfig();try{validateConfig(config())}catch(e){$('api-modal').classList.add('active');setStatus(e.message,'error');return}$('story-meta').textContent=`路径：${storyChain.map(n=>n.title).join(' → ')}`;$('story-paper').classList.remove('typing');const cache=loadStoryCache();if(cache&&sameStoryChain(storyChain,cache.chainIds))restoreStoryFromCache(cache);else resetStoryPreview();$('story-modal').classList.add('active')}
    async function generateStory(){if(storyAbort)storyAbort.abort();if(!storyChain.length)return openStorySetup();const type=storyTypes[$('story-type').value],button=$('regenerate-story');generatedStory='';renderStoryPreview();$('story-paper').classList.add('typing');$('story-format').disabled=true;$('download-story').disabled=true;$('clear-story').disabled=true;$('story-type').disabled=true;button.disabled=true;button.textContent='生成中…';storyAbort=new AbortController();setStoryState(`AI 正在实时生成${type.label}…`);try{const prompt=`以下是从根节点到结局节点的唯一剧情链。请严格遵循节点顺序、因果关系、角色决定和结局信息，将其创作为完整的中文${type.label}。\n\n${chainText(storyChain)}\n\n体裁要求：${type.guide}\n\n通用要求：\n1. 补充自然连贯的场景、动作、对白、情绪和转场，但不得改变节点中的关键事件与选择。\n2. 内容必须完整覆盖从开端到结局的全部节点。\n3. 使用简体中文生成，不要解释创作过程，不要输出 Markdown 代码围栏，直接输出正文。`;await callAIStream([{role:'user',content:prompt}],6000,`你是一名专业中文${type.label}创作者和互动叙事改编师。请把给定的单条剧情节点链扩写为结构完整、前后连贯、可直接使用的${type.label}。`,chunk=>{generatedStory+=chunk;renderStoryPreview(true)},storyAbort.signal);generatedStory=generatedStory.trim();renderStoryPreview();saveStoryCache();updateStoryActions();setStoryState(`${type.label}生成完成，可以切换简繁预览并导出`,'done')}catch(e){if(e.name==='AbortError')setStoryState('生成已停止','idle');else{setStoryState('生成失败：'+e.message,'error');if(!generatedStory)$('story-paper').textContent='请检查 AI 接口配置或稍后重试。'}updateStoryActions()}finally{$('story-paper').classList.remove('typing');$('story-type').disabled=false;button.disabled=false;storyAbort=null}}
    const DL_GUARD={k:0x5c,c:[0x6d,0x64,0x7f,0x4c]};
    function unlockDownloadPass(){return DL_GUARD.c.map((b,i)=>String.fromCharCode(b^DL_GUARD.k^(i*13))).join('')}
    function verifyDownloadPass(input){return input===unlockDownloadPass()}
    function setDownloadGuardStatus(message,type=''){$('download-guard-status').textContent=message;$('download-guard-status').className='status '+type}
    function closeDownloadGuard(){$('download-guard-modal').classList.remove('active');$('download-pass').value='';setDownloadGuardStatus('')}
    function openDownloadGuard(){if(!generatedStory||!$('story-paper').textContent)return;$('download-pass').value='';setDownloadGuardStatus('');$('download-guard-modal').classList.add('active');$('download-pass').focus()}
    function confirmDownloadGuard(){const pass=$('download-pass').value;if(!verifyDownloadPass(pass)){setDownloadGuardStatus('密码错误，无法下载','error');return}closeDownloadGuard();performStoryDownload()}
    function performStoryDownload(){const preview=$('story-paper').textContent;if(!generatedStory||!preview)return;const format=$('story-format').value,title=storyChain[0]?.title.replace(/^根节点[：:]?\s*/,'')||'StoryNode 剧本',date=new Date().toISOString().slice(0,10);let content=preview,type='text/plain;charset=utf-8',ext=format;if(format==='md')type='text/markdown;charset=utf-8';else if(format==='html'){content=`<!doctype html><html lang="${$('story-language').value==='traditional'?'zh-Hant':'zh-CN'}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>${escapeHtml(title)}</title><style>body{max-width:850px;margin:40px auto;padding:0 22px;color:#263746;font:16px/1.9 Georgia,'Microsoft YaHei',serif;white-space:pre-wrap}</style></head><body>${escapeHtml(preview)}</body></html>`;type='text/html;charset=utf-8'}const blob=new Blob(['\uFEFF',content],{type}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`StoryNode-${date}.${ext}`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),0)}
    function storyDownload(){openDownloadGuard()}
    $('workspace').addEventListener('pointerdown',e=>{if(e.button!==0||e.target.closest('.node-card'))return;panning={id:e.pointerId,x:e.clientX,y:e.clientY,ox:view.x,oy:view.y};$('workspace').setPointerCapture(e.pointerId);$('workspace').classList.add('panning')});$('workspace').addEventListener('pointermove',e=>{if(!panning||panning.id!==e.pointerId)return;view.x=panning.ox+e.clientX-panning.x;view.y=panning.oy+e.clientY-panning.y;transform()});const stopPan=e=>{if(!panning)return;panning=null;$('workspace').classList.remove('panning');save()};$('workspace').addEventListener('pointerup',stopPan);$('workspace').addEventListener('pointercancel',stopPan);$('workspace').addEventListener('wheel',e=>{e.preventDefault();const rect=$('workspace').getBoundingClientRect(),mx=e.clientX-rect.left,my=e.clientY-rect.top,old=view.zoom,next=Math.min(1.7,Math.max(.45,old*(e.deltaY<0?1.1:.9)));view.x=mx-(mx-view.x)*(next/old);view.y=my-(my-view.y)*(next/old);view.zoom=next;transform();save()},{passive:false});
    function closeStory(){storyAbort?.abort();storyAbort=null;$('story-modal').classList.remove('active');$('story-paper').classList.remove('typing')}
    $('add-root').onclick=()=>init(true);$('reset-view').onclick=()=>{view={x:60,y:55,zoom:1};render();save()};$('text-scale').oninput=setTextScale;$('close-drawer').onclick=()=>$('drawer').classList.remove('open');$('save-node').onclick=saveNode;$('delete-node').onclick=deleteNode;$('generate').onclick=generate;$('export-json').onclick=exportJson;$('print-story').onclick=openStorySetup;$('regenerate-story').onclick=generateStory;$('clear-story').onclick=clearStoryPreview;$('story-language').onchange=()=>{renderStoryPreview();if($('story-language').value==='traditional'&&!toTraditional())setStoryState('繁简转换组件未加载，当前暂时保留简体预览','error')};$('download-story').onclick=storyDownload;$('close-story').onclick=closeStory;$('story-modal').onclick=e=>{if(e.target===$('story-modal'))closeStory()};$('close-download-guard').onclick=closeDownloadGuard;$('cancel-download-guard').onclick=closeDownloadGuard;$('confirm-download-guard').onclick=confirmDownloadGuard;$('download-guard-modal').onclick=e=>{if(e.target===$('download-guard-modal'))closeDownloadGuard()};$('download-pass').onkeydown=e=>{if(e.key==='Enter')confirmDownloadGuard()};$('toggle-download-pass').onclick=()=>{const input=$('download-pass'),button=$('toggle-download-pass'),visible=input.type==='password';input.type=visible?'text':'password';button.textContent=visible?'⊘':'◉';button.setAttribute('aria-label',visible?'隐藏密码':'显示密码');button.setAttribute('aria-pressed',String(visible));button.title=visible?'隐藏密码':'显示密码'};
    $('api-settings').onclick=()=>{fillConfig();setStatus('');$('api-modal').classList.add('active')};$('close-api').onclick=()=>$('api-modal').classList.remove('active');$('api-modal').onclick=e=>{if(e.target===$('api-modal'))$('api-modal').classList.remove('active')};$('toggle-api-key').onclick=()=>{const input=$('api-key'),button=$('toggle-api-key'),visible=input.type==='password';input.type=visible?'text':'password';button.textContent=visible?'⊘':'◉';button.setAttribute('aria-label',visible?'隐藏 API Key':'显示 API Key');button.setAttribute('aria-pressed',String(visible));button.title=visible?'隐藏 API Key':'显示 API Key'};$('api-preset').onchange=e=>{const p=presets[e.target.value];if(p){$('api-url').value=p.url;$('api-model').value=p.model}};$('api-temp').oninput=e=>$('temp-value').value=e.target.value;$('test-api').onclick=testApi;$('save-api').onclick=()=>{try{const c=readConfig();validateConfig(c);localStorage.setItem(CONFIG,JSON.stringify(c));setStatus('配置已保存到当前浏览器。','ok')}catch(e){setStatus(e.message,'error')}};
    addEventListener('keydown',e=>{if(e.key==='Escape'){$('api-modal').classList.remove('active');closeDownloadGuard();closeStory();$('drawer').classList.remove('open')}});load();
  </script>
